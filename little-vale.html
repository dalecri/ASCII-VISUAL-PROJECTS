/* Quiet Pixel v3, dark ground. One accent: lamp. The world is the canvas; UI floats over it in small surfaces. */
:root {
  --void: #1E1826; --surface: #2A2233; --surface-2: #251F2D;
  --text: #EDE7F2; --muted: #9B8FA8; --line: #3D3448;
  --lamp: #E8873A; --moon: #B9A9D9; --sun: #F2C94C;
  --glass: rgba(30, 24, 38, 0.82);
  --ring: rgba(232, 135, 58, 0.22);
  --ease: cubic-bezier(.4, 0, .2, 1);
  --mono: 'Space Mono', ui-monospace, 'Courier New', monospace;
  --display: 'Alpha Lyrae', 'Space Mono', ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--void); color: var(--text); font-family: var(--mono); font-size: 13px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: none;
}
canvas#world { position: fixed; inset: 0; width: 100vw; height: 100%; display: block; }
button { font-family: var(--mono); color: inherit; }
button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

/* ---------- HUD ---------- */
#hud {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px));
  display: flex; gap: 6px; align-items: center; pointer-events: none;
  transition: opacity .4s var(--ease);
}
.pill {
  display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 10px;
  font-size: 12px; font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.pill svg { width: 15px; height: 15px; flex: none; }
#clock-ico .moon { display: none; }
#clock-ico.night .sun { display: none; }
#clock-ico.night .moon { display: inline; }
#hud-motes { color: var(--sun); }
#hud-motes[data-n="0"] { display: none; }
.lamps-done { color: var(--lamp); }

#tools {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
  display: flex; gap: 6px;
}
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); padding: 0;
  background: var(--glass); color: var(--text); cursor: pointer; display: grid; place-items: center;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: background .2s var(--ease), border-color .2s var(--ease);
}
.icon-btn:hover { border-color: var(--muted); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn .dot { position: absolute; }
#btn-journal { position: relative; }
#btn-journal[data-new="1"]::after {
  content: ""; position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%;
  background: var(--lamp); box-shadow: 0 0 8px 2px var(--ring);
}
#btn-sound .on { display: none; }
#btn-sound[aria-pressed="true"] .on { display: inline; }
#btn-sound[aria-pressed="true"] .off { display: none; }

body:not(.playing) #hud, body:not(.playing) #tools, body:not(.playing) #touch, body:not(.playing) #dock { display: none !important; }

/* ---------- message + prompt ---------- */
#dock {
  position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#msg {
  max-width: 560px; padding: 11px 16px; border-radius: 12px;
  background: var(--glass); border: 1px solid var(--line);
  font-size: 13.5px; line-height: 1.55; text-align: center; text-wrap: balance;
  opacity: 0; transform: translateY(6px); transition: opacity .3s var(--ease), transform .3s var(--ease);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
#msg.show { opacity: 1; transform: none; }
#msg .fr { display: block; margin-top: 6px; color: var(--moon); font-style: italic; font-size: 12.5px; }
#msg .art { color: var(--sun); white-space: pre; }
#prompt {
  display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px 0 4px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 9px;
  font-size: 12px; font-weight: 700; opacity: 0; transition: opacity .2s var(--ease);
}
#prompt.show { opacity: 1; }
kbd {

  for (const bx of BRIDGE_X) for (let ty = 0; ty < TH; ty++) if (T[ty][bx] === 'W') { n = Math.min(n, ty); s = Math.max(s, ty); }

    if (d < 1) setT(tx, ty, ',');
  }
  const heights = [6, 4, 3, 5, 2, 4, 3];
  for (let k = 0; k < 7; k++) {
    const a = -Math.PI / 2 + k * (Math.PI * 2 / 7);
    const tx = Math.round(RUIN.cx + Math.cos(a) * 4.2), ty = Math.round(RUIN.cy + Math.sin(a) * 3.3);
    if (k === 4) { PILLARS.push({ tx, ty, h: 0, fallen: true }); continue; }   // fallen pillar, walkable

  // Paths (drawn as wobbly polylines)
  const routes = [
    [[37, 21], [37, 24], [39, 26], [40.5, BRIDGE_N]],
    [[36, 22], [30, 20], [25, 15], [21, 14.2]],
    [[40, 21], [44, 18], [48, 14], [52, 10.5]],
    [[39, 24], [47, 25], [55, 24], [63, 23.5]],
    [[40.5, BRIDGE_S], [40.5, 41], [33, 43], [24, 43], [16, 42.5]],
    [[41, 42], [48, 43.5], [56, 43], [65, 43.5]],
    [[21, 15], [20, 19], [14, 20.5], [8, 21], [5, 20.5]],
    [[16, 42.5], [10, 44], [8, 45]],
    [[25, 15], [27, 10], [28, 7.5]],
    [[62, 23.5], [63, 18], [66, 15.5]],

      const len = Math.hypot(x1 - x0, y1 - y0), steps = Math.ceil(len * 4);

        const t = i / steps;

        const tx = Math.round(px), ty = Math.round(py);

  }
  // Cottage, porch, garden
  for (let ty = COTTAGE.ty0; ty <= COTTAGE.ty1; ty++) for (let tx = COTTAGE.tx0; tx <= COTTAGE.tx1; tx++) setT(tx, ty, 'H');
  setT(39, 16, 'H');
  for (let tx = 31; tx <= 43; tx++) if (getT(tx, 21) === '.') setT(tx, 21, ',');
  for (let ty = 18; ty <= 20; ty++) for (let tx = 42; tx <= 44; tx++) setT(tx, ty, 'G');

  // Objects
  for (const l of LANTERNS) setT(l.tx, l.ty, 'L');

  // Reeds around water
  for (let ty = 0; ty < TH; ty++) for (let tx = 0; tx < TW; tx++) {
    if (T[ty][tx] !== '.') continue;
    let nearW = false, nearP = false;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const c = getT(tx + dx, ty + dy);

      if (c === 'P') nearP = true;
    }
    if ((nearP && hash(tx, ty, 41) < 0.5) || (nearW && hash(tx, ty, 42) < 0.28)) T[ty][tx] = 'B';
  }

  // Clearings that trees may not cover
  const clear = [];
  const addClear = (tx, ty, r) => clear.push([tx, ty, r]);
  for (const l of LANTERNS) addClear(l.tx, l.ty, 2);
  for (const s2 of STONES) addClear(s2.tx, s2.ty, 2.2);

  const inClear = (tx, ty) => clear.some(([x, y, r]) => (tx - x) ** 2 + (ty - y) ** 2 < r * r);
  const nearPath = (tx, ty) => {

      const c = getT(tx + dx, ty + dy); if (c === ',' || c === 'D') return true;

    if (T[ty][tx] !== '.') continue;

    const edge = Math.min(tx, ty, TW - 1 - tx, TH - 1 - ty);
    const g = vnoise(tx / 5, ty / 5, 3);

    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 2; dx++) if (getT(c.tx + dx, c.ty + dy) === '.') setT(c.tx + dx, c.ty + dy, 'F');

}

const SOLID = new Set(['T', 'W', 'P', 'H', 'R', 'S', 'L']);
const isSolid = (tx, ty) => SOLID.has(getT(tx, ty));
// @@WORLD-END

/* =====================================================================
   BASE CELLS: built once from the tiles. Ground layer (B*) and an
   overlay layer (O*) for canopies and pillar tops the player walks behind.
   ===================================================================== */
const N = WC * WR;
const BCH = new Array(N).fill(' '), BFG = new Array(N).fill(PAL.grass), BBG = new Array(N).fill(PAL.grass);
const OCH = new Array(N).fill(null), OFG = new Array(N).fill(null), OBG = new Array(N).fill(null);
const WATER = [];                  // animated water cells, bucketed by row
for (let y = 0; y < WR; y++) WATER.push([]);
const MAPLES = [];                 // tree tiles that drop leaves

const GRASS_RAMP = [
  mix(PAL.grass, PAL.grassShadow, 0.55), mix(PAL.grass, PAL.grassShadow, 0.3), mix(PAL.grass, PAL.grassShadow, 0.1),
  mix(PAL.grass, PAL.grassLight, 0.12), mix(PAL.grass, PAL.grassLight, 0.3), mix(PAL.grass, PAL.grassLight, 0.46),
];
const SAND_RAMP = [mix(PAL.sand, PAL.sandEdge, 0.2), PAL.sand, mix(PAL.sand, PAL.sandLight, 0.35)];
const GRASSY = new Set(['.', 'T', 'S', 'B', 'F', 'L', 'G']);

function put(wx, wy, ch, fg, bg) {
  if (wx < 0 || wy < 0 || wx >= WC || wy >= WR) return;
  const i = wy * WC + wx;
  if (ch !== null) BCH[i] = ch;
  if (fg) BFG[i] = fg;
  if (bg) BBG[i] = bg;
}
function putO(wx, wy, ch, fg, bg) {
  if (wx < 0 || wy < 0 || wx >= WC || wy >= WR) return;
  const i = wy * WC + wx;
  OCH[i] = ch; OFG[i] = fg; OBG[i] = bg || null;
}
const cellT = (wx, wy) => getT(Math.floor(wx / 2), Math.floor(wy / 2));
function waterDepth(wx, wy, set, cap) {
  for (let r = 1; r <= cap; r++)
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const x = wx + dx;
        if (x < 0 || x >= WC) continue;         // river runs off the map edge
        if (!set.has(cellT(x, wy + dy))) return r - 1;
      }

}
const RIVER_SET = new Set(['W', 'D']), POND_SET = new Set(['P', 'D']);
const isDock = (tx, ty) => ty === DOCK_ROW && tx >= DOCK_X0 && tx <= DOCK_X1;

function buildCells() {
  for (let wy = 0; wy < WR; wy++) {
    for (let wx = 0; wx < WC; wx++) {
      const i = wy * WC + wx, tx = wx >> 1, ty = wy >> 1;
      let t = T[ty][tx];
      const h1 = hash(wx, wy, 1), h2 = hash(wx, wy, 2), h3 = hash(wx, wy, 4);
      if ((t === ',' || t === '.') && h1 < 0.16) {           // dithered path edges
        const d = Math.floor(h2 * 4);
        const nt = cellT(wx + (d === 0 ? -1 : d === 1 ? 1 : 0), wy + (d === 2 ? -1 : d === 3 ? 1 : 0));
        if ((t === ',' && nt === '.') || (t === '.' && nt === ',')) t = nt;
      }
      if (t === 'W') {
        const k = Math.min(2, waterDepth(wx, wy, RIVER_SET, 2));
        BBG[i] = PAL.river[k]; BCH[i] = ' ';
        WATER[wy].push({ wx, kind: 0, k, h: h1 });
      } else if (t === 'P') {
        const k = Math.min(3, waterDepth(wx, wy, POND_SET, 3));
        BBG[i] = PAL.pond[k]; BCH[i] = ' ';
        const nearDock = Math.abs(wy - DOCK_ROW * 2) < 4 && wx >= DOCK_X0 * 2 - 6;
        if (k >= 1 && !nearDock && h3 < 0.07) {
          BCH[i] = h2 < 0.2 ? '*' : 'o';
          BFG[i] = h2 < 0.2 ? '#f6a5c0' : (h2 < 0.6 ? '#5aa83e' : '#3f8f3a');
        } else WATER[wy].push({ wx, kind: 1, k, h: h1 });
      } else if (t === 'D') {
        if (isDock(tx, ty)) {
          const end = wx === DOCK_X0 * 2;
          BBG[i] = end ? mix(PAL.plank, PAL.plankDark, 0.35) : PAL.plank;
          BCH[i] = end || (wx % 4 === 0 && wy % 2 === 1) ? '|' : '=';
          BFG[i] = PAL.plankDark;
        } else {
          const lx = wx - BRIDGE_X[0] * 2, rail = lx === 0 || lx === 3;
          BBG[i] = rail ? mix(PAL.plank, PAL.plankDark, 0.55) : PAL.plank;
          BCH[i] = rail ? '|' : '=';
          BFG[i] = rail ? '#3d2817' : PAL.plankDark;
          if (rail && (cellT(wx, wy - 1) !== 'D' || cellT(wx, wy + 1) !== 'D')) BCH[i] = '#';
        }
      } else if (t === ',' || t === 'R') {
        BBG[i] = SAND_RAMP[Math.floor(clamp(vnoise(wx / 4, wy / 3, 5) * 2.2 + (h2 - 0.5) * 0.9, 0, 2.99))];
        let edge = false;
        for (let d = 0; d < 4 && !edge; d++)
          if (GRASSY.has(cellT(wx + (d === 0 ? -1 : d === 1 ? 1 : 0), wy + (d === 2 ? -1 : d === 3 ? 1 : 0)))) edge = true;
        if (edge && h3 < 0.32) { BCH[i] = h1 < 0.5 ? '.' : 'o'; BFG[i] = PAL.sandEdge; }
        else if (h3 < 0.1) { BCH[i] = pick(['.', ':', ',', '.'], h2); BFG[i] = h1 < 0.5 ? PAL.sandEdge : PAL.sandLight; }
        else BCH[i] = ' ';
      } else {
        const n = vnoise(wx / 15, wy / 9, 1) * 0.72 + vnoise(wx / 5, wy / 3.5, 2) * 0.28;
        const gi = clamp(Math.floor(n * 6.4 - 0.2 + (hash(wx, wy, 3) - 0.5) * 0.9), 0, 5);
        BBG[i] = GRASS_RAMP[gi];
        if (h3 < 0.22) {
          const r = hash(wx, wy, 6);
          BCH[i] = r < 0.34 ? '.' : r < 0.6 ? ',' : r < 0.86 ? "'" : '"';
          BFG[i] = gi >= 3 ? (h2 < 0.68 ? PAL.grassShadow : mix(PAL.grassLight, '#ffffff', 0.25)) : (h2 < 0.6 ? PAL.grassLight : PAL.grassDeep);
        } else BCH[i] = ' ';
        if (t === 'B') {
          BBG[i] = mix(BBG[i], PAL.grassShadow, 0.35);
          if (h1 < 0.8) {
            const r = hash(wx, wy, 7);
            if (r < 0.08) { BCH[i] = '!'; BFG[i] = '#8a5a32'; }
            else { BCH[i] = pick(['|', '|', '/', '\\', "'", 'i', '|'], r); BFG[i] = pick([PAL.grassDeep, PAL.grassShadow, '#5f9e3c', PAL.grassLight], h2); }
          }
        } else if (t === 'F' && h1 < 0.5) {
          BCH[i] = pick(['*', 'o', '*', '.', '`', '*'], h2);
          BFG[i] = pick(PAL.flowers, hash(wx, wy, 8));
        } else if (t === 'G') {
          BBG[i] = mix('#7a5a3a', '#5e4430', h2 * 0.6);
          const row = wy % 2 === 0;
          BCH[i] = row ? (h1 < 0.3 ? 'o' : h1 < 0.7 ? 'Y' : 'v') : (h1 < 0.5 ? '~' : ' ');
          BFG[i] = row ? (BCH[i] === 'o' ? '#e8862e' : '#7fbf4f') : '#5e4430';
        }
      }
      BFG[i] = BFG[i] || PAL.grass;
    }
  }

  // Trees: north to south so lower canopies overlap upper ones
  for (let ty = 0; ty < TH; ty++) for (let tx = 0; tx < TW; tx++) if (T[ty][tx] === 'T') drawTree(tx, ty);
  for (const p of PILLARS) drawPillar(p);
  for (const s of STONES) if (s.kind !== 'pillar') drawStone(s);
  drawCottage();
  // Rune ring carved into the plaza
  for (let k = 0; k < 28; k++) {
    const a = (k / 28) * Math.PI * 2;
    const wx = Math.round((RUIN.cx + 0.5) * 2 + Math.cos(a) * 4.4), wy = Math.round((RUIN.cy + 0.5) * 2 + Math.sin(a) * 2.6);
    put(wx, wy, k % 2 ? '.' : ':', PAL.sandEdge);
  }
}

function drawTree(tx, ty) {
  const cx = tx * 2, cy = ty * 2;
  const r = hash(tx, ty, 21);
  const edge = Math.min(tx, ty, TW - 1 - tx, TH - 1 - ty);
  const kind = r < (edge < 3 ? 0.42 : 0.24) ? 'pine' : (r < 0.56 ? 'maple' : 'oak');
  const pal = kind === 'pine' ? PAL.pine : kind === 'maple' ? PAL.maple[Math.floor(hash(tx, ty, 22) * 3)] : PAL.leaf;
  const ground = (wx, wy) => BBG[wy * WC + wx] || PAL.grass;
  // trunk + shadow on the ground
  for (let dx = 0; dx < 2; dx++) put(cx + dx, cy + 1, '|', PAL.trunk, mix(ground(cx + dx, cy + 1), PAL.grassDeep, 0.5));
  for (const dx of [-1, 2]) {
    const wx = cx + dx;
    if (wx >= 0 && wx < WC && cy + 1 < WR && GRASSY.has(cellT(wx, cy + 1))) put(wx, cy + 1, null, null, mix(ground(wx, cy + 1), PAL.grassDeep, 0.3));
  }
  if (kind === 'maple') {
    MAPLES.push({ x: (cx + 1) * CU, y: (cy - 1) * CV, pal });
    for (let k = 0; k < 6; k++) {          // fallen leaves around the trunk
      const wx = cx - 2 + Math.floor(hash(tx, ty, 30 + k) * 6), wy = cy + 1 + Math.floor(hash(tx, ty, 40 + k) * 3);
      if (wx >= 0 && wy < WR && wx < WC && GRASSY.has(cellT(wx, wy)) && cellT(wx, wy) !== 'T') put(wx, wy, pick([',', '.', '`'], hash(wx, wy, 9)), pick(PAL.leafFall, hash(wx, wy, 10)));
    }
  }
  const cells = [[0, -2], [1, -2], [-1, -1], [0, -1], [1, -1], [2, -1], [-1, 0], [0, 0], [1, 0], [2, 0]];
  for (const [dx, dy] of cells) {
    const wx = cx + dx, wy = cy + dy;
    const hh = hash(wx, wy, 23);
    if (kind === 'pine') {
      const left = dx === Math.min(...cells.filter((c) => c[1] === dy).map((c) => c[0]));
      const right = dx === Math.max(...cells.filter((c) => c[1] === dy).map((c) => c[0]));
      if (left) putO(wx, wy, '/', pal.sh, null);
      else if (right) putO(wx, wy, '\\', pal.sh, null);
      else putO(wx, wy, hh < 0.5 ? '^' : 'A', mix(pal.hi, '#ffffff', 0.15), dy === 0 ? pal.sh : pal.mid);
    } else {
      const lit = -dx * 0.45 - dy * 0.5 + (hh - 0.5) * 0.8;
      const bg = lit > 0.4 ? pal.hi : lit > -0.45 ? pal.mid : pal.sh;
      const fg = lit > 0.4 ? mix(pal.hi, '#ffffff', 0.4) : lit > -0.45 ? pal.hi : mix(pal.sh, '#1b2e17', 0.45);
      const set = kind === 'maple' ? ['*', '&', '%', '*', '#'] : ['@', '&', '%', '8', '#'];
      putO(wx, wy, pick(set, hash(wx, wy, 24)), fg, bg);
    }
  }
}

function drawPillar(p) {
  const cx = p.tx * 2, cy = p.ty * 2;
  if (p.fallen) {
    const row = cy + 1;
    const s = '=o==o=';
    for (let k = 0; k < s.length; k++) put(cx - 2 + k, row, s[k], PAL.stoneDark, k % 3 === 0 ? PAL.stoneMid : PAL.stone);
    return;
  }
  put(cx, cy + 1, '[', PAL.stoneDark, PAL.stoneMid); put(cx + 1, cy + 1, ']', PAL.stoneDark, PAL.stoneMid);
  for (let k = 0; k < p.h; k++) {
    const wy = cy - k;
    const top = k === p.h - 1;
    const chL = top ? '_' : (p.runes && k % 2 === 1 ? ':' : '|');
    const chR = top ? '_' : (p.runes && k % 2 === 0 ? '.' : '|');
    const f = wy >= cy ? put : putO;
    f(cx, wy, chL, top ? PAL.stoneDark : (p.runes ? '#6aa0b0' : PAL.stoneMid), top ? PAL.stoneMid : PAL.stone);
    f(cx + 1, wy, chR, top ? PAL.stoneDark : (p.runes ? '#6aa0b0' : PAL.stoneDark), top ? PAL.stoneDark : PAL.stoneMid);
  }
}

function drawStone(s) {
  const cx = s.tx * 2, cy = s.ty * 2;
  if (s.kind === 'statue') {
    putO(cx, cy - 1, '(', PAL.stoneDark, PAL.stone); putO(cx + 1, cy - 1, ')', PAL.stoneDark, PAL.stoneMid);
    put(cx, cy, '/', PAL.stoneDark, PAL.stone); put(cx + 1, cy, '\\', PAL.stoneDark, PAL.stoneMid);
    put(cx, cy + 1, '[', PAL.stoneDark, PAL.stoneMid); put(cx + 1, cy + 1, ']', PAL.stoneDark, PAL.stoneDark);
  } else {
    putO(cx, cy - 1, '.', PAL.stoneDark, PAL.stone); putO(cx + 1, cy - 1, '-', PAL.stoneDark, PAL.stoneMid);
    put(cx, cy, ':', '#6aa0b0', PAL.stone); put(cx + 1, cy, '|', PAL.stoneDark, PAL.stoneMid);
    put(cx, cy + 1, '|', PAL.stoneDark, PAL.stoneMid); put(cx + 1, cy + 1, ':', '#6aa0b0', PAL.stoneDark);
  }
}

/* Cottage: 14 x 9 cells, origin at world cell (68, 33) */
const COT = { x: 68, y: 33 };
const WINDOWS = [{ x: COT.x + 3, y: COT.y + 5 }, { x: COT.x + 8, y: COT.y + 5 }];
function drawCottage() {
  const X = COT.x, Y = COT.y;
  const roofRows = [[3, 10], [2, 11], [1, 12], [0, 13]];
  roofRows.forEach(([a, b], r) => {
    for (let x = a; x <= b; x++) {
      const edgeL = x === a, edgeR = x === b;
      const ch = edgeL ? '/' : edgeR ? '\\' : r === 0 ? '_' : ((x + r) % 2 ? '=' : '-');
      const bg = edgeL || edgeR ? null : (r % 2 ? PAL.roof : mix(PAL.roof, PAL.roofHi, 0.35));
      put(X + x, Y + 1 + r, ch, edgeL || edgeR ? PAL.roofDark : PAL.roofDark, bg);
    }
  });
  put(X + 10, Y, '[', PAL.stoneDark, PAL.stoneMid); put(X + 11, Y, ']', PAL.stoneDark, PAL.stoneMid);
  put(X + 10, Y + 1, '|', PAL.stoneDark, PAL.stoneMid); put(X + 11, Y + 1, '|', PAL.stoneDark, PAL.stoneDark);
  for (let r = 5; r <= 8; r++) for (let x = 1; x <= 12; x++) {
    const edge = x === 1 || x === 12;
    put(X + x, Y + r, edge ? '|' : (r === 8 && x % 3 === 0 ? '_' : ' '), PAL.wallLine, edge ? mix(PAL.wall, PAL.wallLine, 0.5) : PAL.wall);
  }
  for (const w of WINDOWS) {
    put(w.x, w.y, '[', PAL.plankDark, PAL.glass); put(w.x + 1, w.y, '+', PAL.plankDark, PAL.glass); put(w.x + 2, w.y, ']', PAL.plankDark, PAL.glass);
    put(w.x, w.y + 1, '[', PAL.plankDark, PAL.glass); put(w.x + 1, w.y + 1, '_', PAL.plankDark, PAL.glass); put(w.x + 2, w.y + 1, ']', PAL.plankDark, PAL.glass);
  }
  put(X + 6, Y + 7, '#', PAL.plankDark, PAL.plank); put(X + 7, Y + 7, '#', PAL.plankDark, PAL.plank);
  put(X + 6, Y + 8, '#', PAL.plankDark, PAL.plank); put(X + 7, Y + 8, '.', '#f2d06b', PAL.plank);
  // flower boxes under the windows
  for (const w of WINDOWS) for (let k = 0; k < 3; k++) put(w.x + k, w.y + 2, pick(['*', 'o', '*'], hash(w.x + k, 3, 3)), pick(PAL.flowers, hash(w.x, k, 5)), mix(PAL.plank, PAL.wall, 0.3));
}
buildCells();

/* =====================================================================
   VIEW + PRE-RENDER
   Everything is in device pixels. Cells are integer-sized so glyphs
   never blur. The ground and overlay are drawn once per resize.
   ===================================================================== */
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d', { alpha: false });
const base = document.createElement('canvas'), bctx = base.getContext('2d', { alpha: false });
const over = document.createElement('canvas'), octx = over.getContext('2d');
const lightCv = document.createElement('canvas'), lctx = lightCv.getContext('2d');
const glowCv = document.createElement('canvas'), gctx = glowCv.getContext('2d');
const view = { W: 0, H: 0, dpr: 1, cw: 10, ch: 15, font: '', dy: 0, camX: 0, camY: 0, ready: false };
let fontFamily = '"Space Mono", "Courier New", monospace';

function layout() {
  const W = window.innerWidth, H = window.innerHeight;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  const target = W < 560 ? W / 38 : W < 1000 ? W / 64 : Math.min(15, W / 112);
  let cwCss = clamp(target, 8.5, 15);
  // keep each pre-rendered canvas under ~12M pixels (iOS limit is 16.7M)
  while ((WC * cwCss * dpr) * (WR * cwCss * 1.5 * dpr) > 12e6 && dpr > 1) dpr -= 0.25;
  const cw = Math.max(5, Math.round(cwCss * dpr)), ch = Math.round(cw * 1.5);
  Object.assign(view, { W, H, dpr, cw, ch });
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const fs = Math.min(cw / 0.6, ch) * 0.98;
  view.font = '700 ' + fs.toFixed(1) + 'px ' + fontFamily;
  view.dy = ch * 0.56;

}
function glyph(c2, x, y, ch, fg, bg) {
  if (bg) { c2.fillStyle = bg; c2.fillRect(x, y, view.cw, view.ch); }
  if (ch && ch !== ' ') { c2.fillStyle = fg; c2.fillText(ch, x + view.cw / 2, y + view.dy); }
}

  const { cw, ch } = view;

  over.width = WC * cw; over.height = WR * ch;
  for (const c2 of [bctx, octx]) { c2.font = view.font; c2.textAlign = 'center'; c2.textBaseline = 'middle'; }
  for (let wy = 0; wy < WR; wy++) for (let wx = 0; wx < WC; wx++) {
    const i = wy * WC + wx;
    glyph(bctx, wx * cw, wy * ch, BCH[i], BFG[i], BBG[i]);
    if (OCH[i] !== null) glyph(octx, wx * cw, wy * ch, OCH[i], OFG[i], OBG[i]);
  }
  ctx.font = view.font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  view.ready = true;
}

/* =====================================================================
   TIME OF DAY + LIGHT
   t runs 0..1 per day. 0 = 05:00 dawn.
   ===================================================================== */
const DAY_LEN = 360;
const AMB = [
  [0.00, [0.66, 0.58, 0.74]], [0.07, [0.96, 0.9, 0.88]], [0.12, [1, 1, 1]], [0.50, [1, 0.98, 0.95]],
  [0.575, [1, 0.84, 0.66]], [0.63, [0.66, 0.52, 0.66]], [0.69, [0.33, 0.37, 0.6]], [0.93, [0.33, 0.37, 0.6]], [1.0, [0.66, 0.58, 0.74]],
];
function ambientAt(t, rain) {
  let k = 0;
  while (k < AMB.length - 2 && t >= AMB[k + 1][0]) k++;
  const [t0, a] = AMB[k], [t1, b] = AMB[k + 1];
  const f = clamp((t - t0) / (t1 - t0), 0, 1), s = f * f * (3 - 2 * f);
  const c = [lerp(a[0], b[0], s), lerp(a[1], b[1], s), lerp(a[2], b[2], s)];
  const rf = 1 - rain * 0.2;
  c[0] *= rf; c[1] *= 1 - rain * 0.17; c[2] *= 1 - rain * 0.1;
  return c;
}
const darknessOf = (amb) => clamp((0.95 - (amb[0] * 0.3 + amb[1] * 0.5 + amb[2] * 0.2)) / 0.5, 0, 1);
const BAYER = [0, 0.5, 0.75, 0.25];
let LACC = new Float32Array(0), GACC = new Float32Array(0), limg = null, gimg = null;

function drawLight(x0, y0, cols, rows, amb, dark, srcs) {
  const n = cols * rows;
  if (LACC.length < n * 3) { LACC = new Float32Array(n * 3); GACC = new Float32Array(n * 3); }
  if (lightCv.width !== cols || lightCv.height !== rows) {
    lightCv.width = glowCv.width = cols; lightCv.height = glowCv.height = rows;
    limg = lctx.createImageData(cols, rows); gimg = gctx.createImageData(cols, rows);
  }
  LACC.fill(0, 0, n * 3); GACC.fill(0, 0, n * 3);
  for (const s of srcs) {
    const R = s.r, R2 = R * R;
    const ax = Math.max(x0, Math.floor((s.x - R) / CU)), bx = Math.min(x0 + cols - 1, Math.ceil((s.x + R) / CU));
    const ay = Math.max(y0, Math.floor((s.y - R) / CV)), by = Math.min(y0 + rows - 1, Math.ceil((s.y + R) / CV));
    for (let cy = ay; cy <= by; cy++) {
      const dy = (cy + 0.5) * CV - s.y;
      for (let cx = ax; cx <= bx; cx++) {
        const dx = (cx + 0.5) * CU - s.x;
        const d2 = (dx * dx + dy * dy) / R2;
        if (d2 >= 1) continue;
        let f = 1 - d2; f = f * f * s.s * dark;
        const j = ((cy - y0) * cols + (cx - x0)) * 3;
        LACC[j] += s.c[0] * f; LACC[j + 1] += s.c[1] * f; LACC[j + 2] += s.c[2] * f;
        if (s.g) { const gf = f * s.g; GACC[j] += s.c[0] * gf; GACC[j + 1] += s.c[1] * gf; GACC[j + 2] += s.c[2] * gf; }
      }
    }
  }
  const L = limg.data, G = gimg.data, STEPS = 7;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y * cols + x, j = i * 3, p = i * 4;
    const b = BAYER[((x0 + x) & 1) + (((y0 + y) & 1) << 1)];
    for (let c = 0; c < 3; c++) {
      // ambient stays smooth; only the added light is banded and dithered
      const v = Math.min(1, amb[c] + Math.floor(LACC[j + c] * STEPS + b * Math.min(1, LACC[j + c] * 10)) / STEPS);
      L[p + c] = v * 255;
      G[p + c] = Math.min(0.2, GACC[j + c] * 0.09) * 255;
    }
    L[p + 3] = 255; G[p + 3] = 255;
  }
  lctx.putImageData(limg, 0, 0); gctx.putImageData(gimg, 0, 0);
  const sx = x0 * view.cw - view.camX, sy = y0 * view.ch - view.camY;
  ctx.imageSmoothingEnabled = false;
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(lightCv, sx, sy, cols * view.cw, rows * view.ch);
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(glowCv, sx, sy, cols * view.cw, rows * view.ch);
  ctx.globalCompositeOperation = 'source-over';
}

/* =====================================================================
   STATE + SAVE
   ===================================================================== */
const SAVE_KEY = 'littleVale.v2';
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const START = { x: 37 * TU + 10, y: 22 * TV + 18 };
function freshState() {
  return {
    v: 2, t: 0.12, day: 1, lit: [false, false, false, false, false, false], pocket: 0,
    motes: [], stories: {}, fish: {}, cats: {}, awake: false, px: START.x, py: START.y, played: 0, seenNight: false,
  };
}
let S = freshState();
function save() {
  if (!started) return;
  S.px = player.x; S.py = player.y;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return d && d.v === 2 ? Object.assign(freshState(), d) : null;
  } catch (e) { return null; }
}
window.claude?.hot?.snapshot?.(() => { save(); return {}; });

const player = { x: START.x, y: START.y, face: 'down', moving: false, walkT: 0 };
const particles = [];
let time = 0, started = false, paused = false;
let rain = 0, rainTarget = 0, rainTimer = 40;

/* ---------- critters ---------- */
const rnd = Math.random;
function landSpot(tx0, ty0, tx1, ty1) {
  for (let k = 0; k < 60; k++) {
    const tx = Math.floor(tx0 + rnd() * (tx1 - tx0)), ty = Math.floor(ty0 + rnd() * (ty1 - ty0));
    const c = getT(tx, ty);
    if (c === '.' || c === 'F') return { x: tx * TU + 10, y: ty * TV + 20 };
  }
  return { x: START.x, y: START.y };
}
const ducks = [0, 1].map((k) => ({ x: (POND.cx - 3 + k * 5) * TU, y: (POND.cy + 0.5 - k) * TV, tx: 0, ty: 0, wait: 0, face: -1 }));
const rabbits = [[44, 2, 60, 8], [20, 37, 34, 44], [48, 16, 62, 21]].map((r) => Object.assign(landSpot(...r), { home: r, hop: 0, vx: 0, vy: 0, face: 1, wait: 1 + rnd() * 3 }));
const butterflies = Array.from({ length: 7 }, (_, k) => {
  const s = landSpot(6, 4, 66, 46);
  return { x0: s.x, y0: s.y, ph: rnd() * 6.28, col: PAL.flowers[k % 5], ax: 30 + rnd() * 40, ay: 20 + rnd() * 25 };
});
const fireflies = Array.from({ length: 22 }, () => {
  const s = landSpot(3, 3, 69, 46);
  return { x0: s.x, y0: s.y, ph: rnd() * 6.28, ax: 30 + rnd() * 60, ay: 20 + rnd() * 40 };
});
const cats = CATS.map((c) => ({ def: c, x: c.tx * TU + 10, y: c.ty * TV + 22, anim: rnd() * 5, hopT: 0, ox: 0, say: 0 }));
function placeCats() {
  for (const c of cats) {
    const home = S.cats[c.def.id];
    c.x = home ? c.def.home[0] * TU : c.def.tx * TU + 10;
    c.y = home ? c.def.home[1] * TV : c.def.ty * TV + 22;

}

/* =====================================================================
   INPUT
   ===================================================================== */
const keys = new Set();
const stick = { on: false, id: null, bx: 0, by: 0, x: 0, y: 0 };
const input = {
  x() { let v = stick.x; if (keys.has('left')) v -= 1; if (keys.has('right')) v += 1; return clamp(v, -1, 1); },
  y() { let v = stick.y; if (keys.has('up')) v -= 1; if (keys.has('down')) v += 1; return clamp(v, -1, 1); },
};
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };
window.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('#journal') && e.code !== 'Escape' && e.code !== 'KeyJ') return;
  if (KEYMAP[e.code]) { keys.add(KEYMAP[e.code]); e.preventDefault(); return; }
  if (e.repeat) return;
  if (e.code === 'KeyE' || e.code === 'Space' || e.code === 'Enter') {
    if (!started) return;
    if (document.activeElement && document.activeElement.tagName === 'BUTTON' && e.code !== 'KeyE') return;
    e.preventDefault(); act();
  } else if (e.code === 'KeyJ') { if (started) toggleJournal(); }
  else if (e.code === 'KeyM') toggleSound();
  else if (e.code === 'Escape') { if (journalOpen) toggleJournal(false); }
});
window.addEventListener('keyup', (e) => { if (KEYMAP[e.code]) keys.delete(KEYMAP[e.code]); });
window.addEventListener('blur', () => keys.clear());

const stickEl = document.getElementById('stick'), knobEl = document.getElementById('knob');
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' || !started || paused) return;
  document.body.classList.add('touch');
  if (stick.on) return;
  stick.on = true; stick.id = e.pointerId; stick.bx = e.clientX; stick.by = e.clientY; stick.x = stick.y = 0;
  stickEl.style.left = e.clientX + 'px'; stickEl.style.top = e.clientY + 'px';
  stickEl.classList.add('on'); knobEl.style.transform = '';
  sfx.unlock();
});
window.addEventListener('pointermove', (e) => {
  if (!stick.on || e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.bx, dy = e.clientY - stick.by;
  const d = Math.hypot(dx, dy), R = 44;
  if (d > R) { dx *= R / d; dy *= R / d; }
  knobEl.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  const m = Math.min(1, d / R);
  stick.x = d > 6 ? (dx / (Math.hypot(dx, dy) || 1)) * m : 0;
  stick.y = d > 6 ? (dy / (Math.hypot(dx, dy) || 1)) * m : 0;
});
function endStick(e) {
  if (!stick.on || e.pointerId !== stick.id) return;
  stick.on = false; stick.x = stick.y = 0; stickEl.classList.remove('on');
}
window.addEventListener('pointerup', endStick);
window.addEventListener('pointercancel', endStick);
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
const actBtn = document.getElementById('act');
actBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); actBtn.classList.add('pressed'); sfx.unlock(); act(); });
actBtn.addEventListener('pointerup', () => actBtn.classList.remove('pressed'));
actBtn.addEventListener('pointerleave', () => actBtn.classList.remove('pressed'));

/* =====================================================================
   MOVEMENT
   ===================================================================== */
const SPEED = 92;
const FEET = [[-6, -2], [6, -2], [-6, -10], [6, -10]];
function blocked(x, y) {
  for (const [dx, dy] of FEET) {
    const px = x + dx, py = y + dy;
    if (px < 4 || py < 4 || px > TW * TU - 4 || py > TH * TV - 2) return true;
    if (isSolid(Math.floor(px / TU), Math.floor(py / TV))) return true;
  }
  return false;
}
function updatePlayer(dt) {
  let ix = input.x(), iy = input.y();
  const len = Math.hypot(ix, iy);
  player.moving = len > 0.05 && !paused;
  if (!player.moving) return;
  const m = Math.min(1, len); ix /= len; iy /= len;
  if (Math.abs(ix) > Math.abs(iy)) player.face = ix < 0 ? 'left' : 'right'; else player.face = iy < 0 ? 'up' : 'down';
  const step = SPEED * dt * m;
  const nx = player.x + ix * step, ny = player.y + iy * step;
  if (!blocked(nx, player.y)) player.x = nx;
  if (!blocked(player.x, ny)) player.y = ny;
  player.walkT += dt * m;
  if (fishing.state !== 'idle') endFishing('You wind in your line.');
  if (msg.anchor && Math.hypot(msg.anchor.x - player.x, msg.anchor.y - player.y) > 70) hideMsg();
}
const ptile = () => [Math.floor(player.x / TU), Math.floor((player.y - 6) / TV)];

/* =====================================================================
   MESSAGES
   ===================================================================== */
const msgEl = document.getElementById('msg');
const msg = { until: 0, anchor: null };
function say(html, secs, anchor) {
  msgEl.innerHTML = html;
  msgEl.classList.add('show');
  msg.until = time + (secs || 3.5); msg.anchor = anchor || null;
}
function hideMsg() { msgEl.classList.remove('show'); msg.until = 0; msg.anchor = null; }
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* =====================================================================
   INTERACTIONS
   ===================================================================== */
function interactables() {
  const out = [];
  LANTERNS.forEach((l, k) => out.push({ kind: 'lantern', k, x: l.tx * TU + 10, y: l.ty * TV + 24 }));
  for (const s of STONES) out.push({ kind: 'stone', s, x: s.tx * TU + 10, y: s.ty * TV + 24 });
  for (const c of cats) out.push({ kind: 'cat', c, x: c.x + c.ox, y: c.y });
  out.push({ kind: 'door', x: COTTAGE.door.tx * TU + 10, y: COTTAGE.door.ty * TV - 2 });
  return out;
}
function fishSpot() {
  const [tx, ty] = ptile();
  if (isDock(tx, ty) && tx <= DOCK_X0 + 1) return { where: 'pond', dir: -1 };
  if (getT(tx, ty) === 'D' && BRIDGE_X.includes(tx)) return { where: 'river', dir: player.face === 'left' ? -1 : 1 };
  return null;
}
function currentAction() {
  if (fishing.state !== 'idle') return { label: fishing.state === 'bite' ? 'Reel' : 'Wait', fn: fishingPress };
  let best = null, bd = 34;
  for (const it of interactables()) {
    const d = Math.hypot((it.x - player.x) * 1, (it.y - player.y) * 0.9);
    if (d < bd) { bd = d; best = it; }
  }
  if (best) {
    if (best.kind === 'lantern') return { label: S.lit[best.k] ? 'Look' : (S.pocket ? 'Light' : 'Look'), fn: () => useLantern(best) };
    if (best.kind === 'stone') return { label: 'Read', fn: () => readStone(best) };
    if (best.kind === 'cat') return { label: S.cats[best.c.def.id] ? 'Pet' : 'Greet', fn: () => meetCat(best.c) };
    if (best.kind === 'door') return { label: 'Rest', fn: rest };
  }
  const f = fishSpot();
  if (f) return { label: 'Fish', fn: () => startFishing(f) };
  return null;
}
let action = null;
function act() {
  if (!started || paused || S.ending) return;
  sfx.unlock();
  if (action) action.fn();
}

function useLantern(it) {
  const l = LANTERNS[it.k];
  const anchor = { x: it.x, y: it.y };
  if (S.lit[it.k]) { say('The lantern hums. Its light smells faintly of honey.', 3, anchor); return; }
  if (!S.pocket) { say('A cold lantern. It needs a mote of light.', 3, anchor); return; }
  S.pocket--; S.lit[it.k] = true;
  burst(l.tx * TU + 10, l.ty * TV, ['*', '+', "'", '.'], [PAL.mote, '#ffffff', PAL.lampLit], 18, 90);
  sfx.lantern(S.lit.filter(Boolean).length);
  const n = S.lit.filter(Boolean).length;
  say(n === 6 ? 'Six flames. Somewhere north, the old stones stir. Go to the circle after dark.' : 'The lantern catches. ' + n + ' of 6 burning.', n === 6 ? 6 : 3, anchor);
  markJournal(); save(); updateHud();
}
function readStone(it) {
  const s = it.s;
  const first = !S.stories[s.id];
  S.stories[s.id] = true;
  say(esc(s.en) + '<span class="fr">' + esc(s.fr) + '</span>', 12, { x: it.x, y: it.y });
  sfx.page();
  if (first) { markJournal(); save(); }
}
function meetCat(c) {
  const d = c.def;
  if (S.cats[d.id]) {
    say(esc(d.home_line), 4, { x: c.x, y: c.y });
    sfx.meow(d.loud ? 1.3 : d.sleepy ? 0.6 : 1);
    burst(c.x + 10, c.y - 20, ['<3', '*'], ['#f6a5c0'], 3, 30);
    return;
  }
  S.cats[d.id] = true;
  sfx.meow(d.loud ? 1.4 : d.sleepy ? 0.6 : 1);
  say('<b>' + d.name + '</b>. ' + esc(d.meet), 6, { x: c.x, y: c.y });
  burst(c.x + 10, c.y - 15, ['*', '+', "'"], ['#ffffff', PAL.mote], 12, 70);
  c.leaving = 1.4;
  markJournal(); save();
}
function rest() {
  if (paused) return;
  paused = true;
  const night = darkness > 0.45;
  hideMsg();
  document.getElementById('fade').classList.add('on');
  sfx.rest();
  setTimeout(() => {
    if (night || S.t > 0.62) { S.day++; S.t = 0.09; } else S.t = 0.64;
    rain = rainTarget = 0; rainTimer = 60;
    player.x = START.x; player.y = START.y; player.face = 'down';
    save();
  }, 1000);
  setTimeout(() => {
    document.getElementById('fade').classList.remove('on');
    paused = false;
    const lit = S.lit.every(Boolean);
    say(S.t < 0.3 ? 'Morning. Day ' + S.day + ' in the vale.' : (lit && !S.awake ? 'Dusk settles. The stones are waiting.' : 'You wake at dusk. The lanterns are coming on.'), 3.5);
  }, 2100);
}

/* ---------- motes ---------- */
function moteVisible(m) { return !S.motes.includes(m.id) && (!m.night || darkness > 0.35); }
function checkMotes() {
  for (const m of MOTES) {
    if (!moteVisible(m)) continue;
    const mx = m.tx * TU + 10, my = m.ty * TV + 18;
    if (Math.abs(mx - player.x) < 15 && my > player.y - 40 && my < player.y + 10) {
      S.motes.push(m.id); S.pocket++;
      burst(mx, my - 6, ['*', '+', "'"], [PAL.mote, '#ffffff'], 12, 70);
      sfx.pickup();
      const left = MOTES.length - S.motes.length;
      say(m.night ? 'A night mote, warm as a coal.' : 'A mote of light.' + (left && S.motes.length === 1 ? ' Carry it to a cold lantern.' : ''), 2.6);
      updateHud(); save();
    }
  }
}

/* ---------- fishing ---------- */
const fishing = { state: 'idle', t: 0, biteAt: 0, where: 'pond', bx: 0, by: 0, window: 0 };
function startFishing(spot) {
  const pcx = Math.floor(player.x / CU), pcy = Math.floor((player.y - 0.01) / CV) - 1;
  let dir = spot.dir;
  const isWater = (x) => { const c = cellT(x, pcy); return c === 'W' || c === 'P'; };
  if (!isWater(pcx + dir * 5)) dir = -dir;
  if (!isWater(pcx + dir * 5)) { say('No open water here.', 2); return; }
  fishing.state = 'wait'; fishing.t = 0; fishing.where = spot.where;
  fishing.biteAt = (1.6 + rnd() * 3.2) * (rain > 0.3 ? 0.7 : 1);
  fishing.bx = pcx + dir * 5; fishing.by = pcy; fishing.dir = dir;
  player.face = dir < 0 ? 'left' : 'right';
  sfx.splash(0.5);
  say('You cast your line.', 1.6);
}
function fishingPress() {
  if (fishing.state === 'wait') { say('Too soon. The ripples settle.', 1.8); fishing.t = 0; fishing.biteAt = 1.2 + rnd() * 2.5; return; }
  if (fishing.state === 'bite') catchFish();
}
function catchFish() {
  const night = darkness > 0.5;
  const pool = FISH.filter((f) => (f.where === 'any' || f.where === fishing.where) &&
    (f.when === 'any' || (f.when === 'night' && night) || (f.when === 'day' && !night) || (f.when === 'rain' && rain > 0.3)));
  let tot = pool.reduce((a, f) => a + f.w, 0), r = rnd() * tot, got = pool[0];
  for (const f of pool) { r -= f.w; if (r <= 0) { got = f; break; } }
  const isNew = !S.fish[got.id];
  S.fish[got.id] = (S.fish[got.id] || 0) + 1;
  burst(fishing.bx * CU + 5, fishing.by * CV, ['~', '.', "'"], ['#ffffff', '#cfefff'], 10, 60);
  sfx.catchFish();
  say((got.id === 'boot' ? 'An old boot. Still, a catch is a catch.' : 'A ' + got.name.toLowerCase() + '!') + ' <span class="art">' + esc(got.art) + '</span>' + (isNew ? ' <b style="color:var(--lamp)">New</b>' : ''), 3.4);
  fishing.state = 'idle';
  if (isNew) markJournal();
  save();
}
function endFishing(text) { fishing.state = 'idle'; if (text) say(text, 1.6); }
function updateFishing(dt) {
  if (fishing.state === 'idle') return;
  fishing.t += dt;
  if (fishing.state === 'wait' && fishing.t >= fishing.biteAt) {
    fishing.state = 'bite'; fishing.window = 0.95; sfx.bite();
  } else if (fishing.state === 'bite') {
    fishing.window -= dt;
    if (fishing.window <= 0) endFishing('It slipped away.');
  }
}

/* ---------- particles ---------- */
function burst(x, y, chars, colors, n, speed) {
  if (reducedMotion) n = Math.ceil(n / 3);
  for (let k = 0; k < n; k++) {
    const a = (k / n) * Math.PI * 2 + rnd() * 0.5, v = speed * (0.6 + rnd() * 0.6);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 1.2, life: 0.8, max: 0.8, c: chars[k % chars.length], col: colors[k % colors.length], glow: true, drag: 0.92 });
  }
}
function updateParticles(dt) {
  for (let k = particles.length - 1; k >= 0; k--) {
    const p = particles[k];
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= p.drag; p.vy *= p.drag;
    if (p.gy) p.vy += p.gy * dt;
    if (p.life <= 0) particles.splice(k, 1);
  }
}
let leafT = 0, smokeT = 0;
function spawnAmbient(dt) {
  if (reducedMotion) return;
  smokeT -= dt;
  if (smokeT <= 0) {
    smokeT = 0.55;
    particles.push({ x: (COT.x + 11) * CU, y: (COT.y - 0.2) * CV, vx: 8 + rnd() * 6 - rain * 10, vy: -16, life: 3.2, max: 3.2, c: 'o', col: '#d8d2dc', drag: 0.995, smoke: true });
  }
  leafT -= dt;
  if (leafT <= 0 && MAPLES.length) {
    leafT = 0.35;
    const vx0 = view.camX / view.cw * CU, vy0 = view.camY / view.ch * CV;
    const vis = MAPLES.filter((m) => m.x > vx0 - 40 && m.x < vx0 + view.W * view.dpr / view.cw * CU + 40 && m.y > vy0 - 40 && m.y < vy0 + view.H * view.dpr / view.ch * CV);
    if (vis.length) {
      const m = vis[Math.floor(rnd() * vis.length)];
      particles.push({ x: m.x + (rnd() - 0.5) * 30, y: m.y, vx: -12 - rnd() * 10, vy: 12 + rnd() * 8, life: 3, max: 3, c: pick([',', '`', "'"], rnd()), col: m.pal.mid, drag: 1, leaf: true });
    }
  }
}

/* ---------- critters ---------- */
function updateCritters(dt) {
  for (const d of ducks) {
    d.wait -= dt;
    if (d.wait <= 0) {
      d.wait = 3 + rnd() * 5;
      for (let k = 0; k < 20; k++) {
        const x = (POND.cx + (rnd() - 0.5) * POND.rx * 1.4) * TU, y = (POND.cy + (rnd() - 0.5) * POND.ry * 1.3) * TV;
        if (getT(Math.floor(x / TU), Math.floor(y / TV)) === 'P' && getT(Math.floor((x + 20) / TU), Math.floor(y / TV)) === 'P' && getT(Math.floor((x - 20) / TU), Math.floor(y / TV)) === 'P') { d.tx = x; d.ty = y; break; }
      }
    }
    if (d.tx) {
      const dx = d.tx - d.x, dy = d.ty - d.y, l = Math.hypot(dx, dy);
      if (l > 2) { d.x += (dx / l) * 10 * dt; d.y += (dy / l) * 10 * dt; d.face = dx < 0 ? -1 : 1; }
    }
  }
  for (const r of rabbits) {
    const dp = Math.hypot(r.x - player.x, r.y - player.y);
    r.hop = Math.max(0, r.hop - dt);
    if (r.hop > 0) {
      const nx = r.x + r.vx * dt, ny = r.y + r.vy * dt;
      const c = getT(Math.floor(nx / TU), Math.floor((ny - 4) / TV));
      if (c === '.' || c === 'F' || c === ',') { r.x = nx; r.y = ny; } else r.hop = 0;
      continue;
    }
    r.wait -= dt;
    if (dp < 60 || r.wait <= 0) {
      const flee = dp < 60;
      const a = flee ? Math.atan2(r.y - player.y, r.x - player.x) + (rnd() - 0.5) : rnd() * Math.PI * 2;
      const v = flee ? 110 : 45;
      r.vx = Math.cos(a) * v; r.vy = Math.sin(a) * v * 0.8; r.face = r.vx < 0 ? -1 : 1;
      r.hop = flee ? 0.35 : 0.22; r.wait = 1.5 + rnd() * 4;
    }
  }
  for (const c of cats) {
    c.anim += dt;
    if (c.leaving !== undefined) {
      c.leaving -= dt;
      if (c.leaving <= 0) {
        burst(c.x + 10, c.y - 10, ["'", '.'], ['#ffffff'], 8, 50);
        c.x = c.def.home[0] * TU; c.y = c.def.home[1] * TV; delete c.leaving;
      }
    }
    if (c.def.hops && !S.cats[c.def.id]) c.ox = Math.round(Math.sin(c.anim * 0.7) * 2) * 10;
    else if (c.def.hops) c.ox = Math.round(Math.sin(c.anim * 0.4) * 1) * 10;
    if (c.def.loud) {
      c.say -= dt;
      if (c.say < -6 - rnd() * 4) {
        c.say = 1.4;
        if (Math.hypot(c.x - player.x, c.y - player.y) < 260) sfx.meow(1.3, 0.35);
      }
    }
  }
}

/* ---------- weather ---------- */
function updateWeather(dt) {
  rainTimer -= dt;
  if (rainTimer <= 0) {
    if (rainTarget > 0) { rainTarget = 0; rainTimer = 70 + rnd() * 80; }
    else if (rnd() < 0.45) { rainTarget = 0.6 + rnd() * 0.4; rainTimer = 30 + rnd() * 35; }
    else rainTimer = 40 + rnd() * 40;
  }
  rain += (rainTarget - rain) * Math.min(1, dt * 0.35);
}
let drops = [];
function drawRain(x0, y0, cols, rows) {
  const want = Math.floor(cols * rows * 0.022 * rain);
  while (drops.length < want) drops.push({ x: x0 + rnd() * (cols + 6), y: y0 + rnd() * rows, l: 0.3 + rnd() * 0.7 });
  if (drops.length > want) drops.length = want;
  ctx.globalAlpha = 0.75;
  for (const d of drops) {
    d.y += 0.9; d.x -= 0.35; d.l -= 0.03;
    if (d.l <= 0 || d.y > y0 + rows || d.x < x0 - 2) { d.x = x0 + rnd() * (cols + 6); d.y = y0 + rnd() * rows * 0.6; d.l = 0.3 + rnd() * 0.7; }
    const gx = Math.floor(d.x), gy = Math.floor(d.y);
    ctx.fillStyle = '#cfe0ff';
    ctx.fillText(d.l < 0.08 ? '.' : '/', gx * view.cw - view.camX + view.cw / 2, gy * view.ch - view.camY + view.dy);
  }
  ctx.globalAlpha = 1;
}

/* =====================================================================
   FINALE
   ===================================================================== */
function inCircle() {
  const dx = (player.x / TU - (RUIN.cx + 0.5)) / 2.6, dy = ((player.y - 6) / TV - (RUIN.cy + 0.5)) / 2;
  return dx * dx + dy * dy < 1;
}
let circleHinted = false;
function checkFinale() {
  if (S.awake || S.ending || !S.lit.every(Boolean)) return;
  if (!inCircle()) { circleHinted = false; return; }
  if (darkness < 0.6) {
    if (!circleHinted) { circleHinted = true; say('The stones are quiet. They wait for full dark.', 3.5); }
    return;
  }
  S.ending = time; S.awake = true;
  hideMsg(); sfx.finale(); save();
  setTimeout(showEnd, reducedMotion ? 800 : 7000);
}
function showEnd() {
  const fishN = Object.keys(S.fish).length, catN = Object.keys(S.cats).length, st = Object.keys(S.stories).length;
  document.getElementById('end-stats').innerHTML =
    [[S.day, S.day === 1 ? 'Day' : 'Days'], [fishN + '/10', 'Fish'], [catN + '/4', 'Cats'], [st + '/4', 'Stones']]
      .map(([b, s]) => '<div class="stat"><b>' + b + '</b><span>' + s + '</span></div>').join('');
  document.getElementById('end').hidden = false;
  paused = true;
  setTimeout(() => document.getElementById('end-keep').focus(), 50);
}

/* =====================================================================
   FRAME RENDER
   ===================================================================== */
let darkness = 0, amb = [1, 1, 1];
const sx = (wx) => wx * view.cw - view.camX;
const sy = (wy) => wy * view.ch - view.camY;
function cellOut(wx, wy, ch, fg, bg) {
  if (wx < 0 || wy < 0 || wx >= WC || wy >= WR) return;
  const x = sx(wx), y = sy(wy);
  if (x < -view.cw || y < -view.ch || x > canvas.width || y > canvas.height) return;
  if (bg !== null) { ctx.fillStyle = bg || BBG[wy * WC + wx]; ctx.fillRect(x, y, view.cw, view.ch); }
  if (ch && ch !== ' ') { ctx.fillStyle = fg; ctx.fillText(ch, x + view.cw / 2, y + view.dy); }
}
const toCX = (x) => Math.floor(x / CU), toCY = (y) => Math.floor((y - 0.01) / CV);

function camera(dt, snap) {
  const W = canvas.width, H = canvas.height, ww = WC * view.cw, wh = WR * view.ch;
  const px = (player.x / CU) * view.cw, py = (player.y / CV) * view.ch;
  const bias = document.body.classList.contains('touch') && H > W ? 0.4 : 0.48;
  let tx = ww <= W ? (ww - W) / 2 : clamp(px - W / 2, 0, ww - W);
  let ty = wh <= H ? (wh - H) / 2 : clamp(py - H * bias, 0, wh - H);
  if (snap) { cam.x = tx; cam.y = ty; }
  const k = Math.min(1, dt * 5);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  view.camX = Math.round(cam.x); view.camY = Math.round(cam.y);
}
const cam = { x: 0, y: 0 };

function drawWater(x0, y0, x1, y1) {
  const T2 = time;
  const sparkle = Math.max(0, 1 - darkness * 1.6) * (1 - rain);
  for (let wy = Math.max(0, y0); wy <= Math.min(WR - 1, y1); wy++) {
    for (const w of WATER[wy]) {
      if (w.wx < x0 || w.wx > x1) continue;
      let ch = ' ', fg = '#ffffff';
      if (w.kind === 0) {
        const v = Math.sin((w.wx + T2 * 2.6) * 0.62 + wy * 2.1 + w.h * 5) + (w.h - 0.5) * 0.6;
        if (v > 0.86) { ch = '~'; fg = mix(PAL.river[w.k], '#ffffff', 0.55); }
        else if (v > 0.7) { ch = '-'; fg = mix(PAL.river[w.k], '#ffffff', 0.3); }
      } else {
        const v = Math.sin(w.wx * 0.5 + T2 * 0.8 + w.h * 6) * Math.sin(wy * 0.9 - T2 * 0.6);
        if (v > 0.84) { ch = '~'; fg = mix(PAL.pond[w.k], '#ffffff', 0.45); }
      }
      if (sparkle > 0 && hash(w.wx, wy, Math.floor(T2 * 2.5)) < 0.005 * sparkle) { ch = '*'; fg = '#ffffff'; }
      if (rain > 0.15 && hash(w.wx, wy, Math.floor(T2 * 7) + 99) < 0.035 * rain) { ch = 'o'; fg = mix(w.kind ? PAL.pond[w.k] : PAL.river[w.k], '#ffffff', 0.5); }
      if (ch !== ' ') cellOut(w.wx, wy, ch, fg, null);
    }
  }
}

/* Sprites: each returns a list of [dx, dy, ch, fg, emissive?] drawn relative to an anchor cell. */
function playerCells() {
  const f = player.face, frame = player.moving ? Math.floor(player.walkT * 7) % 2 : -1, P = PLAYER;
  const hat = f === 'left' ? ['<', '\\'] : f === 'right' ? ['/', '>'] : ['/', '\\'];
  let r1;
  if (f === 'down') r1 = [['%', P.scarf], ['#', P.shirt]];
  else if (f === 'up') r1 = [['[', P.scarf], [']', P.scarf]];
  else if (f === 'left') r1 = [['o', P.skin], ['#', P.shirt]];
  else r1 = [['#', P.shirt], ['o', P.skin]];
  const legs = frame === 0 ? ['/', '|'] : frame === 1 ? ['|', '\\'] : ['|', '|'];
  return [[0, -2, hat[0], P.hat], [1, -2, hat[1], P.hat], [0, -1, r1[0][0], r1[0][1]], [1, -1, r1[1][0], r1[1][1]], [0, 0, legs[0], P.legs], [1, 0, legs[1], P.legs]];
}
const PLAYER = { hat: '#f2d06b', shirt: '#3c6fd1', scarf: '#e0573e', legs: '#3a4a6b', skin: '#f3cda4' };

function catCells(c) {
  const d = c.def, night = darkness > 0.55;
  const sleeping = d.sleepy;
  let face = d.face;
  if (night && !sleeping) face = 'o.o';
  const blink = !sleeping && (c.anim % 4.3) < 0.15;
  const tail = Math.floor(c.anim * (d.loud ? 3 : 1.4)) % 3 === 0 ? '_' : '~';
  const out = [];
  for (let k = 0; k < 3; k++) {
    let ch = face[k];
    if (blink && k !== 1) ch = '-';
    const eye = k !== 1 && night && !sleeping && !blink;
    out.push([k, -1, ch, eye ? '#d9ff7a' : d.cols[0][k], eye]);
  }
  for (let k = 0; k < 3; k++) out.push([k, 0, d.body[k], d.cols[1][k]]);
  out.push([3, 0, tail, d.cols[2]]);
  if (sleeping && Math.sin(c.anim * 1.3) > 0) out.push([3, -2 - (Math.floor(c.anim) % 2), 'z', '#c9c4ba', false, true]);
  if (d.loud && c.say > 0) out.push([3, -2, '!', '#ffe27a', true, true]);
  return out;
}

function lanternCells(k) {
  const lit = S.lit[k];
  const fl = lit ? 0.5 + 0.5 * Math.sin(time * 9 + k * 2) * Math.sin(time * 5.3 + k) : 0;
  return [
    [0, -1, '/', PAL.iron], [1, -1, '\\', PAL.iron],
    [0, 0, '[', lit ? '#7a3f10' : PAL.iron, lit, false, lit ? mix(PAL.lampLit, '#ffe6a8', fl) : '#57525c'],
    [1, 0, ']', lit ? '#7a3f10' : PAL.iron, lit, false, lit ? mix(PAL.lampLit, '#ffe6a8', 1 - fl) : '#4a4550'],
    [0, 1, '|', PAL.plankDark], [1, 1, '|', PAL.plankDark],
  ];
}

const emissive = [];   // drawn after lighting
function drawSprite(ax, ay, cells) {
  for (const [dx, dy, ch, fg, emit, noBg, bg] of cells) {
    if (emit) { emissive.push([ax + dx, ay + dy, ch, fg, bg || null]); continue; }
    cellOut(ax + dx, ay + dy, ch, fg, noBg ? null : (bg || undefined));
  }
}

function render() {
  const W = canvas.width, H = canvas.height, cw = view.cw, ch = view.ch;
  ctx.fillStyle = '#25331f'; ctx.fillRect(0, 0, W, H);
  const x0 = Math.max(0, Math.floor(view.camX / cw)), y0 = Math.max(0, Math.floor(view.camY / ch));
  const x1 = Math.min(WC - 1, Math.ceil((view.camX + W) / cw)), y1 = Math.min(WR - 1, Math.ceil((view.camY + H) / ch));
  const dx = -view.camX, dy = -view.camY;
  ctx.drawImage(base, dx, dy);
  drawWater(x0, y0, x1, y1);
  emissive.length = 0;

  // Gather sprites and draw them in depth order
  const list = [];
  LANTERNS.forEach((l, k) => list.push([l.tx * 2, l.ty * 2, l.ty * TV + 30, lanternCells(k)]));
  for (const c of cats) list.push([toCX(c.x + c.ox) - 1, toCY(c.y), c.y, catCells(c)]);
  for (const r of rabbits) {
    const hopUp = r.hop > 0 ? -1 : 0;
    list.push([toCX(r.x), toCY(r.y) + hopUp, r.y, r.face > 0 ? [[0, 0, 'o', '#d8c8b0'], [1, 0, '"', '#e9dcc8']] : [[0, 0, '"', '#e9dcc8'], [1, 0, 'o', '#d8c8b0']]]);
  }
  for (const d of ducks) list.push([toCX(d.x) - 1, toCY(d.y), d.y, d.face < 0 ? [[0, 0, '<', '#f0a030', 0, 1], [1, 0, 'o', '#ffffff', 0, 1], [2, 0, '=', '#f2efe8', 0, 1]] : [[0, 0, '=', '#f2efe8', 0, 1], [1, 0, 'o', '#ffffff', 0, 1], [2, 0, '>', '#f0a030', 0, 1]]]);
  list.push([toCX(player.x) - 1, toCY(player.y), player.y, playerCells(), 'p']);
  list.sort((a, b) => a[2] - b[2]);
  for (const s of list) drawSprite(s[0], s[1], s[3]);

  // Fishing line + bobber
  if (fishing.state !== 'idle') {
    const pcx = toCX(player.x) + (fishing.dir < 0 ? -1 : 2), pcy = toCY(player.y) - 1;
    for (let x = Math.min(pcx, fishing.bx) + 1; x < Math.max(pcx, fishing.bx); x++) cellOut(x, pcy - (Math.abs(x - pcx) < 2 ? 1 : 0), x === pcx ? '' : '-', 'rgba(255,255,255,.6)', null);
    const bite = fishing.state === 'bite';
    cellOut(fishing.bx, fishing.by + (bite && Math.sin(time * 30) > 0 ? 1 : 0), bite ? 'O' : 'o', '#ff5a4a', null);
    if (bite) emissive.push([fishing.bx, fishing.by - 1, '!', '#ffe27a', null]);
  }

  // Particles that sit in the world (smoke, leaves)
  for (const p of particles) {
    if (p.glow) continue;
    const a = p.life / p.max;
    if (p.smoke) { ctx.globalAlpha = a * 0.7; cellOut(toCX(p.x), toCY(p.y), a > 0.6 ? 'o' : a > 0.3 ? 'o' : '.', p.col, null); ctx.globalAlpha = 1; }
    else cellOut(toCX(p.x + Math.sin(time * 3 + p.max) * 6), toCY(p.y), p.c, p.col, null);
  }
  // Butterflies by day
  const dayAmt = 1 - darkness;
  if (dayAmt > 0.4 && rain < 0.4) for (const b of butterflies) {
    const x = b.x0 + Math.sin(time * 0.33 + b.ph) * b.ax, y = b.y0 + Math.sin(time * 0.27 + b.ph * 1.7) * b.ay;
    cellOut(toCX(x), toCY(y), Math.sin(time * 14 + b.ph) > 0 ? 'v' : 'w', b.col, null);
  }

  ctx.drawImage(over, dx, dy);
  // Ghost the player when a canopy hides them
  const pcx = toCX(player.x) - 1, pcy = toCY(player.y);
  let hidden = false;
  for (let k = 0; k < 2 && !hidden; k++) for (let r = -2; r <= 0; r++) {
    const i = (pcy + r) * WC + pcx + k;
    if (i >= 0 && i < N && OCH[i] !== null && OBG[i]) { hidden = true; break; }
  }
  if (hidden) { ctx.globalAlpha = 0.55; for (const [cdx, cdy, c, f] of playerCells()) cellOut(pcx + cdx, pcy + cdy, c, f, null); ctx.globalAlpha = 1; }

  // Lighting
  const srcs = [];
  if (darkness > 0.02) {
    LANTERNS.forEach((l, k) => { if (S.lit[k]) srcs.push({ x: l.tx * TU + 10, y: l.ty * TV + 4, r: 120, c: [1, 0.66, 0.32], s: 0.98 + 0.07 * Math.sin(time * 9 + k), g: 1 }); });
    for (const w of WINDOWS) srcs.push({ x: (w.x + 1.5) * CU, y: (w.y + 1) * CV, r: 80, c: [1, 0.78, 0.45], s: 0.8, g: 0.6 });
    srcs.push({ x: player.x + (player.face === 'left' ? -8 : 8), y: player.y - 14, r: 82, c: [1, 0.76, 0.46], s: 0.62, g: 0.3 });
    for (const m of MOTES) if (moteVisible(m)) srcs.push({ x: m.tx * TU + 10, y: m.ty * TV + 18, r: 46, c: [1, 0.92, 0.55], s: 0.8 });
    for (const f of fireflies) {
      const fx = f.x0 + Math.sin(time * 0.21 + f.ph) * f.ax, fy = f.y0 + Math.sin(time * 0.17 + f.ph * 1.7) * f.ay;
      f.cx = fx; f.cy = fy; f.p = 0.5 + 0.5 * Math.sin(time * 1.6 + f.ph * 3);
      if (f.p > 0.3) srcs.push({ x: fx, y: fy, r: 24, c: [0.7, 0.85, 0.4], s: f.p * 0.45 });
    }
    if (S.awake) {
      const e = S.ending ? clamp((time - S.ending) / 4, 0, 1) : 1;
      srcs.push({ x: (RUIN.cx + 0.5) * TU, y: (RUIN.cy + 0.5) * TV, r: 60 + 150 * e, c: [0.55, 0.85, 1], s: 1.2 * e, g: 1 });
      for (const p of PILLARS) if (!p.fallen) srcs.push({ x: p.tx * TU + 10, y: p.ty * TV - p.h * 6, r: 60 * e, c: [0.6, 0.9, 1], s: e });
    }
    drawLight(x0, y0, x1 - x0 + 1, y1 - y0 + 1, amb, darkness, srcs);
  } else if (amb[0] < 0.995 || amb[1] < 0.995 || amb[2] < 0.995) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgb(' + Math.round(amb[0] * 255) + ',' + Math.round(amb[1] * 255) + ',' + Math.round(amb[2] * 255) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  // Emissive: things that glow regardless of the hour
  for (const [ex, ey, c, f, bg] of emissive) cellOut(ex, ey, c, f, bg === null ? null : bg);
  if (darkness > 0.3) {
    ctx.globalAlpha = clamp((darkness - 0.3) * 2, 0, 1);
    for (const w of WINDOWS) for (let k = 0; k < 3; k++) for (let r = 0; r < 2; r++) cellOut(w.x + k, w.y + r, k === 1 ? (r ? '_' : '+') : (k ? ']' : '['), '#8a5a2a', r ? '#f2b65e' : PAL.glowWin);
    ctx.globalAlpha = 1;
    // the player's lantern
    const lx = toCX(player.x) + (player.face === 'left' ? -1 : 2), ly = toCY(player.y) - 1;
    cellOut(lx, ly, 'o', '#ffd98a', null);
  }
  for (const m of MOTES) {
    if (!moteVisible(m)) continue;
    const ph = m.id * 0.9, pulse = 0.5 + 0.5 * Math.sin(time * 3 + ph);
    const alpha = m.night ? clamp((darkness - 0.35) * 4, 0, 1) : 1;
    ctx.globalAlpha = alpha;
    const gx = m.tx * 2 + 1, gy = m.ty * 2 + 1 + (Math.sin(time * 1.6 + ph) > 0.6 ? -1 : 0);
    cellOut(gx, gy, pulse > 0.45 ? '*' : '+', mix('#f5c33b', PAL.mote, pulse), null);
    if (pulse > 0.7) { cellOut(gx - 1, gy, '.', PAL.moteCore, null); cellOut(gx + 1, gy, '.', PAL.moteCore, null); }
    ctx.globalAlpha = 1;
  }
  if (darkness > 0.35 && !reducedMotion) {
    ctx.globalAlpha = clamp((darkness - 0.35) * 3, 0, 1);
    for (const f of fireflies) if (f.p > 0.3) cellOut(toCX(f.cx), toCY(f.cy), f.p > 0.75 ? '*' : '.', mix('#a8d860', '#f2ffb0', f.p), null);
    ctx.globalAlpha = 1;
  }
  for (const p of particles) if (p.glow) cellOut(toCX(p.x), toCY(p.y), p.life < p.max * 0.35 ? '.' : p.c, p.col, null);
  if (S.awake) drawRunes();
  if (rain > 0.05) drawRain(x0, y0, x1 - x0 + 1, y1 - y0 + 1);
  if (S.awake && darkness > 0.4) drawAurora();
}

function drawRunes() {
  const e = S.ending ? clamp((time - S.ending) / 3, 0, 1) : 1;
  const RUNES = '*+x.o:*+';
  const n = 28, lit = Math.floor(n * e);
  for (let k = 0; k < lit; k++) {
    const a = (k / n) * Math.PI * 2 + time * 0.15;
    const wx = Math.round((RUIN.cx + 0.5) * 2 + Math.cos(a) * 4.4), wy = Math.round((RUIN.cy + 0.5) * 2 + Math.sin(a) * 2.6);
    const p = 0.5 + 0.5 * Math.sin(time * 2 + k);
    cellOut(wx, wy, RUNES[(k + Math.floor(time * 2)) % RUNES.length], mix(PAL.rune, '#ffffff', p * 0.6), null);
  }
  if (S.ending && time - S.ending < 7 && !reducedMotion) {
    // motes rising from the circle
    const k = Math.floor((time - S.ending) * 12);
    if (k % 2 === 0) particles.push({ x: (RUIN.cx + 0.5 + (rnd() - 0.5) * 4) * TU, y: (RUIN.cy + 0.8 + (rnd() - 0.5) * 2) * TV, vx: (rnd() - 0.5) * 10, vy: -40 - rnd() * 40, life: 2, max: 2, c: pick(['*', '+', "'"], rnd()), col: pick([PAL.rune, PAL.mote, '#ffffff'], rnd()), glow: true, drag: 0.99 });
  }
}
function drawAurora() {
  const W = canvas.width, rows = Math.ceil(canvas.height * 0.42 / view.ch), cols = Math.ceil(W / view.cw);
  const fade = clamp((darkness - 0.4) * 2.5, 0, 1) * (S.ending ? clamp((time - S.ending - 1.5) / 3, 0, 1) : 1) * (1 - rain * 0.7);
  if (fade <= 0) return;
  const off = view.camX / view.cw;
  ctx.globalCompositeOperation = 'lighter';
  for (let band = 0; band < 3; band++) {
    const col = band === 0 ? [80, 230, 170] : band === 1 ? [140, 120, 240] : [90, 200, 240];
    for (let x = 0; x < cols; x++) {
      const gx = x + Math.floor(off * 0.3);
      const yc = rows * (0.3 + band * 0.18) + Math.sin(gx * 0.07 + time * 0.25 + band * 2) * rows * 0.16 + Math.sin(gx * 0.19 - time * 0.4) * 1.5;
      for (let r = -2; r <= 2; r++) {
        const y = Math.round(yc + r);
        if (y < 0) continue;
        const a = (1 - Math.abs(r) / 2.6) * fade * (0.18 + 0.12 * Math.sin(gx * 0.3 + time + band));
        if (a <= 0.02) continue;
        ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + a.toFixed(3) + ')';
        ctx.fillText(Math.abs(r) === 0 ? '~' : (r < 0 ? "'" : '.'), x * view.cw + view.cw / 2, y * view.ch + view.dy);
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* =====================================================================
   HUD + JOURNAL
   ===================================================================== */
const el = (id) => document.getElementById(id);
let lastClock = '';
function updateHud() {
  const mins = Math.floor(((5 + S.t * 24) % 24) * 6) * 10;
  const hh = Math.floor(mins / 60) % 24, mm = mins % 60;
  const c = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  if (c !== lastClock) { el('clock').textContent = c; lastClock = c; }
  el('clock-ico').classList.toggle('night', darkness > 0.45);
  const n = S.lit.filter(Boolean).length;
  el('hud-lamps').textContent = n + '/6';
  el('lamps-pill').classList.toggle('lamps-done', n === 6);
  el('hud-motes').dataset.n = S.pocket; el('hud-motes-n').textContent = S.pocket;
}
function markJournal() { el('btn-journal').dataset.new = '1'; if (journalOpen) renderJournal(); }
let journalOpen = false;
function toggleJournal(force) {
  journalOpen = force === undefined ? !journalOpen : force;
  const j = el('journal');
  j.classList.toggle('open', journalOpen); j.setAttribute('aria-hidden', journalOpen ? 'false' : 'true');
  if (journalOpen) { renderJournal(); el('btn-journal').dataset.new = '0'; keys.clear(); setTimeout(() => el('j-close').focus(), 30); }
  else el('btn-journal').focus({ preventScroll: true });
}
function renderJournal() {
  el('j-day').textContent = 'Day ' + S.day;
  const lit = S.lit.filter(Boolean).length;
  const catsFound = CATS.filter((c) => S.cats[c.id]).length;
  const fishN = FISH.filter((f) => S.fish[f.id]).length;
  const st = STONES.filter((s) => S.stories[s.id]).length;
  let h = '';
  h += '<section class="j-sec"><h3>Lanterns <span>' + lit + '/6</span></h3><div class="lamps">' +
    S.lit.map((l) => '<div class="lamp' + (l ? ' lit' : '') + '">/\\\n[]</div>').join('') + '</div></section>';
  h += '<section class="j-sec"><h3>Cats <span>' + catsFound + '/4</span></h3><div class="cats">' +
    CATS.map((c) => {
      const f = S.cats[c.id];
      const art = f ? '<pre><span style="color:' + c.cols[0][0] + '">' + esc(c.face) + '</span>\n<span style="color:' + c.cols[1][0] + '">' + esc(c.body) + '</span><span style="color:' + c.cols[2] + '">~</span></pre>' : '<pre>?.?\n(_)~</pre>';
      return '<div class="cat' + (f ? '' : ' unknown') + '">' + art + '<b>' + (f ? c.name : '???') + '</b>' + (f ? '<span>' + c.role + '</span>' : '') + '</div>';
    }).join('') + '</div></section>';
  h += '<section class="j-sec"><h3>Fish <span>' + fishN + '/10</span></h3><div class="fish">' +
    FISH.map((f) => {
      const n = S.fish[f.id];
      return '<div class="f' + (n ? '' : ' unknown') + '">' + (n ? '<pre>' + esc(f.art) + '</pre>' : '') + '<b>' + (n ? f.name : '???') + '</b><span>' + WHERE_LABEL[f.where] + ', ' + WHEN_LABEL[f.when] + (n ? ' · ' + n : '') + '</span></div>';
    }).join('') + '</div></section>';
  h += '<section class="j-sec"><h3>Stones <span>' + st + '/4</span></h3><div class="stones">' +
    STONES.map((s) => S.stories[s.id] ? '<div class="stone">' + esc(s.en) + '<i>' + esc(s.fr) + '</i></div>' : '<div class="stone unknown">: . : . :</div>').join('') + '</div></section>';
  el('j-body').innerHTML = h;
}
el('btn-journal').addEventListener('click', () => { if (started) toggleJournal(); });
el('j-close').addEventListener('click', () => toggleJournal(false));

const promptEl = el('prompt'), promptT = el('prompt-t');
let lastLabel = null;
function updatePrompt() {
  action = started && !paused && !S.ending ? currentAction() : null;
  const label = action ? action.label : null;
  if (label === lastLabel) return;
  lastLabel = label;
  if (label) promptT.textContent = label;
  promptEl.classList.toggle('show', !!label);
  actBtn.textContent = label || '·';
  actBtn.classList.toggle('ready', !!label);
}

/* =====================================================================
   SOUND: soft synth, all generated
   ===================================================================== */
const sfx = (() => {
  let ac = null, master = null, rainGain = null, on = false, birdT = 3, cricketT = 1, noteT = 2;
  function ensure() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 0.6;
    rainGain = ac.createGain(); rainGain.gain.value = 0;
    src.connect(bp).connect(rainGain).connect(master); src.start();
    noise = buf;
    return true;
  }
  let noise = null;
  function tone(freq, dur, type, vol, when, slideTo) {
    if (!on || !ac) return;
    const t = ac.currentTime + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur * 0.8);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function hiss(dur, vol, freq) {
    if (!on || !ac) return;
    const t = ac.currentTime, s = ac.createBufferSource(); s.buffer = noise;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 900;
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(master); s.start(t, Math.random()); s.stop(t + dur);
  }
  const PENT_DAY = [523.25, 587.33, 659.25, 783.99, 880, 1046.5], PENT_NIGHT = [220, 261.63, 293.66, 329.63, 392, 440];
  return {
    get on() { return on; },
    unlock() { if (ac && ac.state === 'suspended') ac.resume(); },
    set(v) {
      if (v && !ensure()) return;
      on = v;
      if (ac) { ac.resume(); master.gain.setTargetAtTime(v ? 0.55 : 0, ac.currentTime, 0.2); }
    },
    tick(dt) {
      if (!on || !ac) return;
      rainGain.gain.setTargetAtTime(rain * 0.16, ac.currentTime, 0.5);
      if (paused) return;
      birdT -= dt; cricketT -= dt; noteT -= dt;
      if (birdT <= 0) {
        birdT = 3 + Math.random() * 6;
        if (darkness < 0.3 && rain < 0.3) { const f = 2200 + Math.random() * 1400; tone(f, 0.08, 'sine', 0.025, 0, f * 1.4); tone(f * 1.1, 0.08, 'sine', 0.02, 0.12, f * 1.5); if (Math.random() < 0.5) tone(f, 0.1, 'sine', 0.02, 0.26, f * 0.8); }
      }
      if (cricketT <= 0) {
        cricketT = 0.7 + Math.random() * 0.9;
        if (darkness > 0.6) for (let k = 0; k < 3; k++) tone(4300 + Math.random() * 200, 0.03, 'sine', 0.008, k * 0.06);
      }
      if (noteT <= 0) {
        noteT = 2.2 + Math.random() * 2.8;
        const sc = darkness > 0.5 ? PENT_NIGHT : PENT_DAY, f = sc[Math.floor(Math.random() * sc.length)];
        tone(f, 2.2, 'sine', 0.03); tone(f * 2, 1.2, 'triangle', 0.006);
      }
    },
    pickup() { tone(880, 0.18, 'triangle', 0.08); tone(1318.5, 0.3, 'triangle', 0.07, 0.08); },
    lantern(n) { [523.25, 659.25, 783.99, 1046.5].forEach((f, k) => tone(f * (1 + n * 0.02), 1.4, 'sine', 0.06, k * 0.09)); hiss(0.4, 0.05, 2400); },
    page() { hiss(0.25, 0.04, 3000); tone(392, 0.6, 'sine', 0.03, 0.05); },
    splash(v) { hiss(0.35, 0.12 * v, 700); },
    bite() { tone(660, 0.1, 'square', 0.035); tone(990, 0.12, 'square', 0.03, 0.1); },
    catchFish() { hiss(0.4, 0.12, 900); [659.25, 783.99, 987.77].forEach((f, k) => tone(f, 0.4, 'triangle', 0.06, 0.1 + k * 0.08)); },
    meow(pitch, vol) {
      if (!on || !ac) return;
      const p = pitch || 1, t = ac.currentTime;
      const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'sawtooth'; f.type = 'bandpass'; f.Q.value = 3;
      o.frequency.setValueAtTime(420 * p, t); o.frequency.linearRampToValueAtTime(700 * p, t + 0.18); o.frequency.linearRampToValueAtTime(480 * p, t + 0.5);
      f.frequency.setValueAtTime(900, t); f.frequency.linearRampToValueAtTime(1800, t + 0.2); f.frequency.linearRampToValueAtTime(1000, t + 0.5);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.08 * (vol || 1), t + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 0.6);
    },
    rest() { [392, 329.63, 261.63].forEach((f, k) => tone(f, 1.6, 'sine', 0.05, k * 0.3)); },
    finale() { [261.63, 329.63, 392, 493.88, 587.33, 783.99, 987.77].forEach((f, k) => { tone(f, 5, 'sine', 0.045, k * 0.35); tone(f * 2, 3, 'triangle', 0.01, k * 0.35 + 0.1); }); },
  };
})();
const soundBtn = el('btn-sound');
function toggleSound(force) {
  const v = force === undefined ? !sfx.on : force;
  sfx.set(v);
  soundBtn.setAttribute('aria-pressed', sfx.on ? 'true' : 'false');
  try { localStorage.setItem('littleVale.sound', sfx.on ? '1' : '0'); } catch (e) { /* ignore */ }
}
soundBtn.addEventListener('click', () => toggleSound());

/* =====================================================================
   LOOP
   ===================================================================== */
let last = performance.now(), saveT = 0, wasDark = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (!view.ready) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  time += dt;
  if (started && !paused && !journalOpen) {
    const prev = S.t;
    S.t += dt / DAY_LEN;
    if (S.t >= 1) { S.t -= 1; S.day++; }
    S.played += dt;
    updatePlayer(dt);
    updateFishing(dt);
    checkMotes();
    checkFinale();
    if (prev < 0.62 && S.t >= 0.62 && !S.seenNight) { S.seenNight = true; say('Dusk. Lanterns glow brighter now, and some motes wake.', 4); }
  }
  if (!paused || !started) { updateWeather(dt); updateCritters(dt); spawnAmbient(dt); }
  updateParticles(dt);
  amb = ambientAt(started ? S.t : 0.6 + Math.sin(time * 0.08) * 0.012, rain);   // title sits in golden hour
  darkness = darknessOf(amb);
  if (msg.until && time > msg.until) hideMsg();
  camera(dt, false);
  render();
  updateHud();
  updatePrompt();
  sfx.tick(dt);
  saveT += dt;
  if (started && saveT > 5) { saveT = 0; save(); }
}

/* =====================================================================
   BOOT
   ===================================================================== */
function startGame(fresh) {
  if (fresh) { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } S = freshState(); }
  delete S.ending;
  placeCats();
  player.x = S.px; player.y = S.py; player.face = 'down';
  if (blocked(player.x, player.y)) { player.x = START.x; player.y = START.y; }
  el('title').hidden = true;
  document.body.classList.add('playing');
  started = true; paused = false;
  camera(0, true);
  let snd = '1';
  try { snd = localStorage.getItem('littleVale.sound') || '1'; } catch (e) { /* ignore */ }
  toggleSound(snd === '1');
  updateHud();
  say(fresh || !S.played ? 'Morning in the vale. The lanterns have gone cold.' : 'Back in the vale. Day ' + S.day + '.', 3.5);
  setTimeout(() => canvas.focus && window.focus(), 30);
}
let pendingNew = false;
const saved = load();
if (saved) {
  S = saved; delete S.ending;
  el('t-go').textContent = 'Continue';
  el('t-new').hidden = false;
}
el('t-go').addEventListener('click', () => startGame(!saved));
el('t-new').addEventListener('click', () => {
  if (!pendingNew) { pendingNew = true; el('t-new').textContent = 'Erase save?'; el('t-new').classList.add('confirm'); return; }
  startGame(true);
});
el('end-keep').addEventListener('click', () => { el('end').hidden = true; paused = false; delete S.ending; save(); });
el('end-new').addEventListener('click', () => { el('end').hidden = true; startGame(true); });

placeCats();
player.x = S.px; player.y = S.py;
if (!saved) { player.x = START.x; player.y = START.y; }

window.__vale = { get S() { return S; }, player, set t(v) { S.t = v; }, set rain(v) { rainTarget = rain = v; }, catchFish, startGame };

let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { layout(); camera(0, true); }, 120); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

const fontsReady = document.fonts && document.fonts.load ? Promise.race([
  Promise.all([document.fonts.load('700 16px "Space Mono"'), document.fonts.load('500 40px "Alpha Lyrae"')]),
  new Promise((r) => setTimeout(r, 1800)),
]) : Promise.resolve();
fontsReady.then(() => {
  if (!(document.fonts && document.fonts.check && document.fonts.check('700 16px "Space Mono"'))) fontFamily = '"Courier New", Courier, monospace';
  layout(); camera(0, true);
  requestAnimationFrame(frame);
});

})();
</script>
