<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#E9EDF0"><title>Seasonal Tree</title>
<style>
:root{--accent:#e8873a;--ink:#4a4840;--muted:#77776d;font-family:'Space Mono',ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#e9edf0;color:var(--ink)}canvas{position:fixed;inset:0;width:100%;height:100%}header{position:fixed;top:30px;left:32px;pointer-events:none}h1{font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;margin:0 0 9px}header p{font-size:9px;letter-spacing:.08em;margin:0;color:var(--muted)}.edition{position:fixed;top:32px;right:32px;font-size:9px;color:var(--muted)}.bar{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:20px;width:max-content;max-width:calc(100% - 28px);padding:14px 18px;border:1px solid #ffffff90;border-radius:14px;background:#ffffffe0;backdrop-filter:blur(18px);box-shadow:0 10px 45px #4a483012}.field{display:grid;gap:9px;min-width:240px}.label{display:flex;justify-content:space-between;gap:18px;font-size:9px;color:var(--muted);letter-spacing:.05em}.label span{text-transform:uppercase}output{font-variant-numeric:tabular-nums;color:#795233}input{width:100%;margin:0;height:18px;accent-color:var(--accent);cursor:pointer}button{min-height:36px;padding:0 12px;font:inherit;font-size:11px;color:var(--ink);border:1px solid #4a483025;border-radius:7px;background:#ffffff40;cursor:pointer}button:hover{background:#e8873a15;border-color:#e8873a80}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:disabled{opacity:.45;cursor:default}#play{color:#925022;border-color:#e8873a75;background:#e8873a12}.actions{display:flex;gap:7px}.readout{font-size:9px;line-height:1.8;padding-left:18px;border-left:1px solid #4a483020;min-width:205px}.readout span{color:var(--muted)}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:7px}@media(max-width:800px){.bar{gap:14px;flex-wrap:wrap;justify-content:center}.readout{width:100%;text-align:center;border:0;padding:0;line-height:1.4}.readout span{margin-left:8px}.field{min-width:220px}header{left:20px;top:23px}.edition{right:20px;top:25px}}@media(max-width:500px){.bar{width:calc(100% - 24px);padding:13px;gap:12px}.field{width:100%;min-width:0}.actions{width:100%}.actions button{flex:1}.edition{display:none}h1{font-size:11px}header p{font-size:8px}.readout{font-size:8px}}
</style></head>
<body>
<canvas id="scene" role="img" aria-label="One seeded ASCII tree changing with the calendar"></canvas>
<header><h1>Seasonal Tree</h1><p>THE SAME TREE. A DIFFERENT DAY.</p></header><span class="edition">CALENDAR STUDY / 004</span>
<div class="bar" id="bar" role="region" aria-label="Season and date controls">
<label class="field"><span class="label"><span>Day of year</span><output id="date" for="day"></output></span><input id="day" type="range" min="1" max="365" step="1" value="1" aria-label="Preview day of year"></label>
<div class="actions"><button id="today">Today</button><button id="play" aria-pressed="false">▶ Play Year</button></div>
<div class="readout"><div><i class="dot" aria-hidden="true"></i><strong id="phase" style="font-weight:400"></strong></div><span id="mode">Following the calendar</span></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d',{alpha:false}),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
function seeded(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const rand=seeded(73194),motionRand=seeded(202603);
const branches=[],leaves=[],wood=new Map();
function glyph(angle){const x=Math.abs(Math.cos(angle)),y=Math.abs(Math.sin(angle));return x<.32?'|':y<.32?'_':Math.cos(angle)*Math.sin(angle)>0?'\\':'/';}
function branch(x,y,angle,length,depth){const endX=x+Math.cos(angle)*length,endY=y+Math.sin(angle)*length;branches.push({x,y,angle,length,depth,endX,endY});const steps=Math.ceil(length*2);for(let i=0;i<=steps;i++){const f=i/steps,cx=Math.round(lerp(x,endX,f)),cy=Math.round(lerp(y,endY,f)),key=cx+','+cy;const cell={x:cx,y:cy,depth,threshold:(depth+f)/9,glyph:glyph(angle),dust:rand()};if(!wood.has(key)||wood.get(key).depth>depth)wood.set(key,cell);}
if(depth>=5){const count=2+Math.floor(rand()*3);for(let i=0;i<count;i++)leaves.push({id:leaves.length,x:Math.round(endX+(rand()-.5)*3.6),y:Math.round(endY+(rand()-.5)*2.6),depth,jitter:rand(),bud:rand(),fallDay:274+rand()*45,turnDay:267+rand()*30,shimmer:rand()*100,base:Math.floor(rand()*3)});}
if(depth<8){for(const side of [-1,1]){const spread=(15+rand()*15)*Math.PI/180;branch(endX,endY,angle+side*spread,length*(.75+rand()*.06),depth+1);}}}
branch(0,0,-Math.PI/2,12.5,0);
const cells=[...wood.values()];for(const c of cells)c.top=!wood.has(c.x+','+(c.y-1));
function mixColor(a,b,t){const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),aa=rgb(a),bb=rgb(b);return 'rgb('+aa.map((v,i)=>Math.round(lerp(v,bb[i],clamp(t)))).join(',')+')';}
// A non-leap calendar keeps the slider stable. Feb 29 shares Feb 28's seasonal state.
function calendarDay(date=new Date()){const month=date.getMonth(),day=date.getDate(),days=[31,28,31,30,31,30,31,31,30,31,30,31];return days.slice(0,month).reduce((a,b)=>a+b,0)+Math.min(day,days[month]);}
function season(d){const winter=d<=59||d>=335;const spring=d>=60&&d<152,summer=d>=152&&d<244;let phase=winter?'winter: quiet branches':spring?(d<75?'early spring: waking':d<100?'spring: buds opening':d<130?'spring: leaves unfolding':'late spring: new growth'):summer?'summer: full canopy':d<274?'early autumn: turning':d<304?'autumn: gold and rust':d<320?'late autumn: leaves falling':'late autumn: resting';return {winter,spring,summer,phase,g:spring?lerp(.25,1,Math.pow(clamp((d-60)/91),.3)):1,amount:d<75||d>=320?0:d<105?smooth((d-75)/30):d<274?1:1-smooth((d-274)/46),snow:winter?(d>=335?lerp(.12,1,(d-335)/30):lerp(1,.15,(d-1)/58)):0,sky:winter?'#E5EBEF':spring?mixColor('#E4EDF0','#F2F0DD',(d-60)/92):summer?mixColor('#F3EEDB','#EEEAD8',(d-152)/92):mixColor('#ECE8D6','#DCE0DF',(d-244)/91)};}
let day=calendarDay(),live=true,playing=false,yearElapsed=0,time=0,lastTime=null,raf=0,lastDraw=-1,width=0,height=0,cw=10,ch=15,baseY=0,particles=[],litter=[],detached=new Set(),spawnClock=0;
function sway(y,t){return reduced.matches?0:Math.sin(t*.45)*clamp(-y/46);}
function leafColor(l,d){if(d<152)return mixColor('#9CC184','#4E7A3A',clamp((d-105)/47+l.jitter*.2));if(d<260)return mixColor('#426B34','#6F9048',l.jitter);const turn=clamp((d-l.turnDay)/17);return turn<.5?mixColor('#4E7A3A','#E8B13A',turn*2):mixColor('#E8B13A','#C65A2E',(turn-.5)*2);}
function leafVisible(l,d,s){if(d<75||d>=320||d>=l.fallDay||detached.has(l.id))return false;if(s.spring&&(l.depth+1)/9>s.g)return false;return d>=105||l.bud<clamp((d-75)/30);}
function put(char,x,y,color,alpha=1){ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.fillText(char,width/2+x*cw,baseY+y*ch);ctx.globalAlpha=1;}
function draw(){const s=season(day);ctx.fillStyle=s.sky;ctx.fillRect(0,0,width,height);ctx.font='14px "Space Mono", ui-monospace, monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=Math.min(ch*.96,cw/0.62)+'px "Space Mono", ui-monospace, monospace';const half=Math.ceil(width/cw/2);
// Quiet horizon marks remain well behind the tree.
for(let x=-half;x<=half;x++){const hill=-3-Math.round(1.3*Math.sin(x*.07)+Math.sin(x*.025));if((x+half)%3===0)put(x%2?'_':'.',x,hill,'#84918A',.17);if(x%5===0&&Math.sin(x*.21)>.2)put('_',x,-37-Math.round(Math.sin(x*.08)*2),'#FFFFFF',.27);}
for(let x=-half;x<=half;x++){const key=(Math.imul(x+1000,31)>>>0)%17;put(s.winter?(key<s.snow*14?'#':'*'):(key%3?'"':','),x,1,s.winter?'#FAFCFD':s.summer?'#889267':s.spring?'#8C9E70':'#B6A37A',s.winter?.7:.65);put(s.winter?(key%3?'*':'#'):(key%4?',':'"'),x,2,s.winter?'#F8FAFC':s.spring||s.summer?'#A2AC86':'#C4B28C',.5);}
put('o',-21,0,'#8D918C');put('o',25,1,'#989B95');
for(const c of cells){if(c.threshold>s.g)continue;put(c.glyph,c.x,c.y,c.depth<5?'#4A3B32':'#6B5748');if(s.snow&&c.top&&c.dust<s.snow*.8)put(c.dust<.35?'*':"'",c.x,c.y-.23,'#FFFFFF',.94);}
for(const l of leaves){if(!leafVisible(l,day,s))continue;const bud=day<100;let char=bud?'+':'*%#'[l.base];if(!reduced.matches&&!bud&&s.summer){const tick=Math.floor(time*.55+l.shimmer);if(Math.sin(tick*12.9898+l.id*4.1414)>.94)char='*%#'[(l.base+1)%3];}put(char,l.x+sway(l.y,time),l.y,bud?'#9CC184':leafColor(l,day),.87);}
for(const l of litter)put(l.char,l.x,0,l.color,clamp(l.life/3)*.65);
for(const p of particles){put(p.char,p.x+Math.sin(p.age*p.frequency+p.seed)*p.sway,p.y,p.color,p.y>-.7?clamp(p.life):.85);}
}
function spawn(s){if(s.winter){particles.push({char:motionRand()<.75?'.':'*',x:(motionRand()-.5)*width/cw,y:-baseY/ch+motionRand()*3,vy:1.2+motionRand(),color:'#FCFDFE',sway:1.6,frequency:.8,seed:motionRand()*6,age:0,life:1,kind:'snow'});}else if(day>=274&&day<320){const eligible=leaves.filter(l=>leafVisible(l,day,s)&&l.fallDay<day+12);if(!eligible.length)return;const l=eligible[Math.floor(motionRand()*eligible.length)];detached.add(l.id);particles.push({char:motionRand()<.5?'*':'+',x:l.x+sway(l.y,time),y:l.y,vy:1.8+motionRand()*1.5,color:leafColor(l,day),sway:1.2,frequency:1.8,seed:motionRand()*6,age:0,life:1,kind:'leaf'});}}
function animate(dt){const s=season(day);spawnClock+=dt;const interval=s.winter?.7:1.5;if(spawnClock>=interval){spawnClock%=interval;if(particles.length<55)spawn(s);}for(const p of particles){p.age+=dt;if(p.y<0)p.y=Math.min(0,p.y+p.vy*dt);else{p.life-=dt*.7;if(p.kind==='leaf'&&!p.landed){p.landed=true;if(motionRand()<.3)litter.push({x:p.x,char:',',color:p.color,life:10+motionRand()*15});}}}particles=particles.filter(p=>p.life>0);for(const l of litter)l.life-=dt;litter=litter.filter(l=>l.life>0);}
function dateLabel(d){const date=new Date(2025,0,Math.round(d));return date.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function updateUI(){$('day').value=Math.round(day);$('date').textContent=(live?new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}):dateLabel(day))+(live?' · today':', preview');$('phase').textContent=season(day).phase;$('play').textContent=playing?'Ⅱ Stop Year':'▶ Play Year';$('play').setAttribute('aria-pressed',String(playing));$('play').disabled=reduced.matches;$('play').title=reduced.matches?'Reduced motion enabled; use the Day slider to preview seasons':'Preview a year in 60 seconds';$('mode').textContent=reduced.matches?'Static · reduced motion':playing?'One year in one minute':live?'Following the calendar':'A moment in the year';canvas.setAttribute('aria-label','ASCII seasonal tree. '+dateLabel(day)+'. '+season(day).phase);}
function resetWeather(){particles=[];litter=[];detached.clear();spawnClock=0;}
function schedule(){if(!raf&&!document.hidden&&!reduced.matches)raf=requestAnimationFrame(frame);}
function frame(now){raf=0;if(document.hidden||reduced.matches){lastTime=null;return;}const dt=lastTime===null?0:Math.min(.1,(now-lastTime)/1000);lastTime=now;time+=dt;if(playing){yearElapsed+=dt;const next=Math.min(365,1+yearElapsed/60*364);if(Math.floor(next)!==Math.floor(day)){if(season(next).winter!==season(day).winter||(day<320&&next>=320))resetWeather();day=next;updateUI();}else day=next;if(yearElapsed>=60){playing=false;day=365;updateUI();}}else if(live){const today=calendarDay();if(today!==day){day=today;resetWeather();updateUI();}}animate(dt);if(now-lastDraw>=1000/24){draw();lastDraw=now;}schedule();}
function resize(){width=innerWidth;height=innerHeight;const reserve=$('bar').getBoundingClientRect().height+60;const scale=Math.max(.18,Math.min(1.2,width/840,(height-reserve-100)/770));cw=10*scale;ch=15*scale;baseY=height-reserve;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
$('day').addEventListener('input',e=>{day=Number(e.target.value);live=false;playing=false;resetWeather();updateUI();draw();});
$('today').addEventListener('click',()=>{day=calendarDay();live=true;playing=false;resetWeather();updateUI();draw();});
$('play').addEventListener('click',()=>{if(reduced.matches)return;if(playing)playing=false;else{live=false;playing=true;yearElapsed=0;day=1;resetWeather();}updateUI();draw();});
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);raf=0;lastTime=null;if(!document.hidden){if(live){day=calendarDay();resetWeather();updateUI();}draw();schedule();}});
reduced.addEventListener('change',()=>{if(reduced.matches){playing=false;cancelAnimationFrame(raf);raf=0;resetWeather();}lastTime=null;updateUI();draw();schedule();});
window.addEventListener('resize',resize);
// A sleeping static scene still follows midnight without running an animation loop.
setInterval(()=>{if(live&&!document.hidden&&calendarDay()!==day){day=calendarDay();resetWeather();updateUI();draw();}},60000);
updateUI();resize();schedule();
</script></body></html>
