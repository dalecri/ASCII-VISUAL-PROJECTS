<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0D1622"><title>Ocean in a Bottle</title>
<style>
:root{color-scheme:dark;--accent:#e8873a;--ink:#d5e6e6;--muted:#849fa7;font-family:'Space Mono',ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#0d1622;color:var(--ink)}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:28px;left:30px;pointer-events:none}h1{font-size:13px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;margin:0 0 9px}header p{font-size:9px;letter-spacing:.07em;color:var(--muted);margin:0}.edition{position:fixed;right:30px;top:30px;font-size:9px;color:var(--muted)}.bar{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);display:flex;align-items:center;gap:18px;padding:13px 17px;background:#162331df;border:1px solid #bfefef20;border-radius:14px;backdrop-filter:blur(18px);box-shadow:0 12px 50px #0003}.field{display:grid;gap:8px}.label{display:flex;justify-content:space-between;gap:18px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}output{color:var(--accent);font-variant-numeric:tabular-nums}input{width:110px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer}button{font:inherit;font-size:11px;min-height:36px;padding:0 12px;border:1px solid #ffffff20;border-radius:7px;background:#ffffff04;color:var(--ink);cursor:pointer;white-space:nowrap}button.primary{color:var(--accent);border-color:#e8873a60;background:#e8873a10}button:hover{border-color:#e8873a80}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:disabled,input:disabled{opacity:.4;cursor:default}button[hidden]{display:none}.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:105px;text-align:center;width:calc(100% - 36px);font-size:9px;line-height:1.7;color:var(--muted);pointer-events:none}#notice{color:#bfefef}@media(max-width:700px){.bar{gap:12px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px)}header{left:20px;top:22px}.edition{display:none}input{width:100px}.hint{font-size:8px}h1{font-size:11px}}@media(max-width:420px){.bar{width:calc(100% - 24px);padding:12px;gap:12px}.field{flex:1;min-width:95px}input{width:100%}button{padding:0 10px;font-size:10px}}
</style></head><body>
<canvas id="scene" role="img" aria-label="An ASCII glass bottle half full of spring-simulated seawater"></canvas>
<header><h1>Ocean in a Bottle</h1><p>A SMALL SEA. A LITTLE GRAVITY.</p></header><span class="edition">WATER STUDY / 008</span>
<div class="hint" id="hint"><span id="help">Move across the sky or drag the bottle to tilt.</span> <span id="notice" role="status"></span></div>
<div class="bar" id="bar" role="region" aria-label="Bottle controls"><button class="primary" id="shake">↗ Shake</button>
<label class="field"><span class="label">Water <output id="levelValue" for="level">50%</output></span><input id="level" type="range" min="20" max="80" step="1" value="50" aria-label="Water level percent"></label>
<label class="field"><span class="label">Tilt <output id="tiltValue" for="tilt">0°</output></span><input id="tilt" type="range" min="-20" max="20" step="0.1" value="0" aria-label="Water tilt angle"></label>
<button id="orientation" hidden>Enable tilt</button><button id="pause" aria-pressed="false" aria-keyshortcuts="Space">Pause</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d',{alpha:false}),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const N=44,CENTRE=(N-1)/2,FLOOR=29,TOP=7.7,DEPTH=22,STEP=1000/60;
const heights=new Float32Array(N),velocities=new Float32Array(N),left=new Float32Array(N),right=new Float32Array(N),cooldown=new Float32Array(N),foam=new Float32Array(N);
let width=0,height=0,cw=11,ch=16,ox=0,oy=0,fill=.5,tilt=0,targetTilt=0,paused=false,raf=0,lastTime=null,accumulator=0,time=0,droplets=[],bubbles=[],touchId=null,sensor=false,sensorTimer=0;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),base=()=>FLOOR-DEPTH*fill;
function hash(x,y){let n=Math.imul(x+714,374761393)^Math.imul(y+941,668265263);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295;}
function calm(){heights.fill(base());velocities.fill(0);foam.fill(0);cooldown.fill(0);tilt=0;targetTilt=0;droplets=[];bubbles=[];updateTilt();}
function updateTilt(){$('tilt').value=targetTilt;$('tiltValue').textContent=Math.round(targetTilt)+'°';}
function setTilt(value){if(reduced.matches||paused)return;targetTilt=clamp(value,-20,20);updateTilt();}
function splash(i,speed){const count=1+Math.floor(Math.random()*3);for(let n=0;n<count&&droplets.length<90;n++)droplets.push({x:i,y:heights[i]-.25,vx:(Math.random()-.5)*.22,vy:-Math.min(.65,.18+speed*.45+Math.random()*.15),age:0});}
function shake(gentle=false){if(reduced.matches||paused)return;for(let n=0;n<(gentle?4:8);n++){const i=Math.floor(Math.random()*N);velocities[i]+=(Math.random()<.5?-1:1)*(gentle?.2:.6+Math.random()*.45);foam[i]=3;}for(let n=0;n<(gentle?4:10);n++){const x=Math.random()*(N-1),i=Math.round(x);bubbles.push({x,y:heights[i]+.8+Math.random()*Math.max(.1,FLOOR-heights[i]-1.5),speed:.025+Math.random()*.035,phase:Math.random()*6.28});}if(bubbles.length>50)bubbles.splice(0,bubbles.length-50);}
function step(){time+=1/60;tilt+=(targetTilt-tilt)*.06;const slope=Math.tan(tilt*Math.PI/180)*cw/ch;for(let i=0;i<N;i++){const target=clamp(base()+slope*(i-CENTRE),TOP+.3,FLOOR-.5);velocities[i]+=.022*(target-heights[i])-.045*velocities[i];heights[i]+=velocities[i];cooldown[i]=Math.max(0,cooldown[i]-1);foam[i]=Math.max(0,foam[i]-1);}
// Classic neighbour relaxation: eight short passes distribute each displacement.
for(let pass=0;pass<8;pass++){left.fill(0);right.fill(0);for(let i=0;i<N;i++){if(i>0){left[i]=.10*(heights[i]-heights[i-1]);velocities[i-1]+=left[i];}if(i<N-1){right[i]=.10*(heights[i]-heights[i+1]);velocities[i+1]+=right[i];}}for(let i=0;i<N;i++){if(i>0)heights[i-1]+=left[i];if(i<N-1)heights[i+1]+=right[i];}}
for(let i=0;i<N;i++){if(heights[i]<TOP){heights[i]=TOP;velocities[i]=Math.abs(velocities[i])*.25;}if(heights[i]>FLOOR-.3){heights[i]=FLOOR-.3;velocities[i]=-Math.abs(velocities[i])*.25;}velocities[i]=clamp(velocities[i],-1.4,1.4);if(Math.abs(velocities[i])>.13)foam[i]=2;if(velocities[i]<-.18&&cooldown[i]===0){splash(i,-velocities[i]);cooldown[i]=16;}}
for(const p of droplets){p.age++;p.vy+=.012;p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>N-1){p.x=clamp(p.x,0,N-1);p.vx*=-.35;}if(p.y<TOP-.5){p.y=TOP-.5;p.vy=Math.abs(p.vy)*.3;}const i=Math.round(p.x);if(p.y>=heights[i]&&p.vy>0){velocities[i]+=Math.min(.10,p.vy*.12);foam[i]=2;p.dead=true;}}
droplets=droplets.filter(p=>!p.dead&&p.age<400);
for(const b of bubbles){b.y-=b.speed;b.phase+=.045;const i=clamp(Math.round(b.x+Math.sin(b.phase)*.3),0,N-1);if(b.y<=heights[i]+.15){foam[i]=2;b.dead=true;}}
bubbles=bubbles.filter(b=>!b.dead);}
function interior(x,y){if(y<4)return x>17&&x<28;if(y<5)return x>16&&x<29;if(y<6)return x>9&&x<36;if(y<7)return x>3&&x<42;if(y<8)return x>1&&x<44;if(y<28)return x>0&&x<45;if(y<29)return x>1&&x<44;if(y<30)return x>3&&x<42;return false;}
function put(char,x,y,color,alpha=1){ctx.fillStyle=color;ctx.globalAlpha=alpha;ctx.fillText(char,ox+x*cw,oy+y*ch);ctx.globalAlpha=1;}
function draw(){ctx.fillStyle='#0D1622';ctx.fillRect(0,0,width,height);ctx.font=Math.min(ch*.91,cw/.62)+'px "Space Mono",ui-monospace,monospace';ctx.textAlign='center';ctx.textBaseline='middle';for(let x=-8;x<=53;x++)put('=',x,32,'#44616D',.23);
for(let i=0;i<N;i++){const surface=Math.round(heights[i]),x=i+1;for(let y=surface;y<30;y++){if(!interior(x,y))continue;const depth=clamp((y-heights[i])/Math.max(1,FLOOR-heights[i]),0,1);if(y===surface)put(foam[i]>0?(hash(i,Math.floor(time*30))>.5?'°':'*'):'~',x,y,foam[i]>0?'#F2FFFC':'#72EFDD');else{const a=[31,138,140],b=[14,74,86],color='rgb('+a.map((v,k)=>Math.round(v+(b[k]-v)*depth)).join(',')+')';const phase=hash(i,y)*6.28+(reduced.matches?0:time*.6);put(Math.sin(phase)>.1?'~':'≈',x,y,color,.86);}}}
for(const b of bubbles){const x=b.x+1+Math.sin(b.phase)*.3;if(interior(x,b.y))put('o',x,b.y,'#BFEFEF',.8);}for(const p of droplets){if(interior(p.x+1,p.y))put("'",p.x+1,p.y,'#BFEFEF');}
// Static 46-column bottle frame: a narrow neck, rounded shoulders and base.
const outline=[];for(let y=1;y<=3;y++)outline.push([17,y],[28,y]);outline.push([16,4],[29,4]);for(let x=10;x<=16;x++)outline.push([x,4]);for(let x=29;x<=35;x++)outline.push([x,4]);for(let x=4;x<=9;x++)outline.push([x,5]);for(let x=36;x<=41;x++)outline.push([x,5]);outline.push([3,6],[42,6],[1,7],[44,7]);for(let y=8;y<=27;y++)outline.push([0,y],[45,y]);outline.push([1,28],[44,28],[2,29],[3,29],[42,29],[43,29]);for(let x=4;x<=41;x++)outline.push([x,30]);for(const [x,y] of outline)put('#',x,y,'#5E8F8F');for(let y=8;y<=26;y++)put('|',2,y,'#BFEFEF',.6);for(let y=1;y<=3;y++)put('|',18,y,'#BFEFEF',.65);for(let y=-1;y<=1;y++)for(let x=18;x<=27;x++)put('#',x,y,'#C8A165',y===-1?.95:.8);}
function active(){return !paused&&!document.hidden&&!reduced.matches;}
function schedule(){if(active()&&!raf)raf=requestAnimationFrame(frame);}
function frame(now){raf=0;if(!active()){lastTime=null;return;}if(lastTime!==null)accumulator+=Math.min(5*STEP,now-lastTime);lastTime=now;while(accumulator>=STEP){step();accumulator-=STEP;}draw();schedule();}
function controls(){$('orientation').textContent=sensor?'Tilt enabled':'Enable tilt';$('pause').textContent=paused?'Resume':'Pause';$('pause').setAttribute('aria-pressed',String(paused));$('pause').disabled=reduced.matches;$('shake').disabled=reduced.matches||paused;$('tilt').disabled=reduced.matches||paused;$('orientation').disabled=reduced.matches||paused;$('help').textContent=reduced.matches?'Reduced motion: a calm sea. Tilt and shake are off.':paused?'Paused · space to resume.':sensor?'Device tilt is on · drag or use the slider to take over.':'Move across the sky or drag the bottle to tilt.';}
function sync(){cancelAnimationFrame(raf);raf=0;lastTime=null;accumulator=0;controls();schedule();}
function resize(){width=innerWidth;height=innerHeight;const barHeight=$('bar').getBoundingClientRect().height,reserve=barHeight+85;const scale=Math.max(.15,Math.min(1.22,(width-38)/(54*11),(height-reserve-90)/(35*16)));cw=11*scale;ch=16*scale;ox=width/2-22.5*cw;const available=height-reserve-65;oy=65+(available-31*ch)/2+ch;$('hint').style.bottom=(barHeight+37)+'px';const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function pointerTilt(e){if(reduced.matches||paused)return;sensor=false;setTilt(((e.clientX-width/2)/(width*.42))*20);controls();}
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.pointerId===touchId)pointerTilt(e);});canvas.addEventListener('pointerdown',e=>{if(!e.isPrimary||(e.pointerType==='mouse'&&e.button!==0))return;touchId=e.pointerId;canvas.setPointerCapture(e.pointerId);pointerTilt(e);});
function endPointer(e){if(e.pointerId!==touchId)return;touchId=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('lostpointercapture',()=>touchId=null);
$('shake').addEventListener('click',()=>shake());$('level').addEventListener('input',e=>{fill=Number(e.target.value)/100;$('levelValue').textContent=e.target.value+'%';if(reduced.matches||paused)calm();draw();});$('tilt').addEventListener('input',e=>{sensor=false;setTilt(Number(e.target.value));controls();});
function togglePause(){if(reduced.matches)return;paused=!paused;sync();}
$('pause').addEventListener('click',togglePause);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!/^(INPUT|SELECT|BUTTON|TEXTAREA)$/.test(e.target.tagName)){e.preventDefault();togglePause();}});
let receivedOrientation=false;
function onOrientation(e){if(!sensor||!active())return;if(typeof e.gamma!=='number'||!Number.isFinite(e.gamma))return;receivedOrientation=true;clearTimeout(sensorTimer);setTilt(e.gamma*.65);}
if(('DeviceOrientationEvent' in window)&&(navigator.maxTouchPoints>0||matchMedia('(pointer: coarse)').matches))$('orientation').hidden=false;
$('orientation').addEventListener('click',async()=>{if(reduced.matches||paused)return;try{const API=window.DeviceOrientationEvent;if(!API)throw Error('Unavailable');if(typeof API.requestPermission==='function'){const permission=await API.requestPermission();if(permission!=='granted')throw Error('Permission denied');}sensor=true;receivedOrientation=false;window.removeEventListener('deviceorientation',onOrientation);window.addEventListener('deviceorientation',onOrientation);$('orientation').textContent='Tilt enabled';$('notice').textContent='';controls();clearTimeout(sensorTimer);sensorTimer=setTimeout(()=>{if(!receivedOrientation){sensor=false;$('orientation').hidden=true;$('notice').textContent='Device tilt unavailable; drag or use the slider.';controls();resize();}},4000);}catch{sensor=false;$('orientation').hidden=true;$('notice').textContent='Use touch-drag or the Tilt slider.';controls();resize();}});
document.addEventListener('visibilitychange',()=>{touchId=null;sync();});reduced.addEventListener('change',()=>{if(reduced.matches)calm();sync();draw();});window.addEventListener('resize',resize);new ResizeObserver(resize).observe($('bar'));
calm();resize();if(!reduced.matches)shake(true);sync();
</script></body></html>
